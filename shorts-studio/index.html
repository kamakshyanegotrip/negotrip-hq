async function recordInto(slot, btn){
  if(CE.rec.active){ const was=CE.rec.slot; stopRec(); if(was===slot) return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}); }
  catch(e){ toast("Microphone not available: allow microphone access for this page, or upload a recording."); return; }
  const mr=new MediaRecorder(stream); const chunks=[]; const t0=Date.now(); const max=46000;
  mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const timer=setInterval(()=>{ const s=(Date.now()-t0)/1000; const b=document.querySelector(`[data-rec="${slot}"]`); if(b) b.textContent=`■ Stop · ${s.toFixed(0)} s`; if(Date.now()-t0>max) stopRec(); },250);
  mr.onstop=async()=>{ clearInterval(timer); stream.getTracks().forEach(t=>t.stop()); if(!CE) return; CE.rec.active=null; CE.rec.slot=null; await setRecording(slot, new Blob(chunks,{type:mr.mimeType||"audio/webm"})); };
  CE.rec.active=mr; CE.rec.slot=slot; mr.start(250); renderCE();
}
async function setRecording(slot, blob){
  try{
    const ch=await decode24k(blob, 45), R=24000, total=ch.length/R;
    const sp=findSplit(ch), cut=sp.at;
    const cw=wavFrom(ch,0,cut), sw=wavFrom(ch,cut,Math.min(ch.length,cut+30*R));
    CE.rec.consent={dur:cut/R, blob:cw, url:URL.createObjectURL(cw), okLen:cut/R>=2.5};
    CE.rec.sample={dur:Math.min(30,(ch.length-cut)/R), blob:sw, url:URL.createObjectURL(sw), okLen:(ch.length-cut)/R>=10};
    CE.rec.total=total; CE.msg = sp.found ? null : {t:"Couldn't hear a clear pause after the permission line, so it was cut at about 6.5 s. Press ▶ Permission line to check it; if it's cut wrongly, record again with a short pause.", bad:true};
  }catch(e){ toast("Couldn't read that recording. Try again or use another file."); }
  renderCE();
}
// any audio -> 24 kHz mono samples (normalised); Google recommends 24 kHz mono 16-bit WAV
async function decode24k(blob, maxSec){
  const buf=await audioCtx().decodeAudioData((await blob.arrayBuffer()).slice(0));
  const len=Math.ceil(Math.min(buf.duration, maxSec||45)*24000);
  const off=new OfflineAudioContext(1, len, 24000); const src=off.createBufferSource(); src.buffer=buf; src.connect(off.destination); src.start();
  const ch=(await off.startRendering()).getChannelData(0);
  let peak=0; for(let i=0;i<ch.length;i++){ const a=Math.abs(ch[i]); if(a>peak) peak=a; }
  const g=peak>0.01?Math.min(4,0.89/peak):1; if(g!==1) for(let i=0;i<ch.length;i++) ch[i]*=g;
  return ch;
}
function wavFrom(ch, a, b){
  const n=Math.max(0,b-a), pcm=new Uint8Array(n*2), dv=new DataView(pcm.buffer);
  for(let i=0;i<n;i++){ const v=Math.max(-1,Math.min(1,ch[a+i])); dv.setInt16(i*2, v<0?v*32768:v*32767, true); }
  return new Blob([pcmToWav(pcm,24000)],{type:"audio/wav"});
}
// where the permission line ends: the first pause (≥0.35 s) after speech starts, 2.5–14 s in
function findSplit(ch){
  const R=24000, F=R/20, n=Math.floor(ch.length/F), rms=new Float32Array(n);
  for(let k=0;k<n;k++){ let s=0; for(let i=k*F;i<(k+1)*F;i++) s+=ch[i]*ch[i]; rms[k]=Math.sqrt(s/F); }
  const sorted=Array.from(rms).sort((a,b)=>a-b), loud=sorted[Math.floor(n*0.9)]||0, thr=Math.max(0.008, loud*0.12);
  let first=0; while(first<n && rms[first]<thr) first++;
  let run=0;
  for(let k=first;k<n;k++){
    if(rms[k]<thr){ run++; const startK=k-run+1;
      if(run>=7 && startK/20>=Math.max(2.5,first/20+2) && startK/20<=14){ let e=k; while(e<n && rms[e]<thr) e++; return {at:Math.floor(((startK+e)/2)*F), found:true}; } }
    else run=0;
  }
  return {at:Math.min(ch.length, Math.floor(6.5*R)), found:false};
}

const PLAY={ key:null, stop:null, n:0 };

async function togglePlay(key, start){
  if(PLAY.key===key){ stopPlay(); return; }
  stopPlay(); const my=++PLAY.n; PLAY.key=key; refreshPlayBtns();
  const done=()=>{ if(PLAY.n===my){ PLAY.key=null; PLAY.stop=null; refreshPlayBtns(); } };
  try{ const stop=await start(done); if(PLAY.n!==my){ try{ stop&&stop(); }catch(e){} return; } PLAY.stop=stop; }
  catch(e){ done(); toast(e.message||"Couldn't play"); }
}
function playUrlFn(url){ return async onEnd=>{ const a=new Audio(url); a.onended=onEnd; a.onerror=onEnd; await a.play(); return ()=>{ a.pause(); a.currentTime=0; }; }; }
function playBufFn(getBuf){ return async onEnd=>{ const buf=await getBuf(); const ctx=audioCtx(); await Promise.race([ctx.resume(),sleep(1500)]); const s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.onended=onEnd; s.start(); return ()=>s.stop(); }; }

    const ctx=audioCtx(); await Promise.race([ctx.resume(),sleep(1500)]); const buf=await ctx.decodeAudioData(bytes.slice(0)); const s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.start(); }catch(e){}

async function frameOf(c){
  const url=await getClipUrl({footage:c}, "720"); if(!url) throw new Error("This footage can't be used as a background.");
  const W=720,H=1280, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d");
  let src, w, h;
  if(c.kind==="photo"){ src=await loadImg(url); w=src.naturalWidth; h=src.naturalHeight; }
  else { src=await loadVideo(url); await seek(src, Math.min(1.2, (src.duration||3)/3)); w=src.videoWidth; h=src.videoHeight; }
  const s=Math.max(W/w,H/h); g.drawImage(src,(W-w*s)/2,(H-h*s)/2,w*s,h*s);
  return { mime:"image/jpeg", data:cv.toDataURL("image/jpeg",0.9).split(",")[1] };
}
async function createShot(i){

  if(SHOT.busy) return;

  try{
    const characters=[]; for(const p of people){ const r=await toJpegB64(await driveUrl(p.look_drive_id),1024,0.9); characters.push({name:p.name, mime:r.mime, data:r.data}); }
    let background=null;
    if(av.bg==="footage"){ const c=bgChoices(sc).find(x=>x.cid===av.bg_cid); if(c) background=await frameOf(c); }
    else if(av.bg==="upload"){ if(!tmp.bg) throw new Error("Upload a photo of the place, or choose another background."); background={mime:tmp.bg.mime,data:tmp.bg.data}; }
    const body={ characters, background, prop_images:(tmp.props||[]).map(p=>({name:p.name,mime:p.mime,data:p.data})), props:av.props, framing:av.framing, what:av.action,
      names:people.map(p=>p.name).join(" and "), setting: av.bg==="describe" ? (av.setting||placeOf(sc)) : placeOf(sc), extra:[(SHOT_FINISH.find(f=>f[0]===av.finish)||[])[2], av.extra].filter(Boolean).join("; ").slice(0,400) };
    const r=await api("shot_image", body);

    const blob=b64ToBlob(r.data, r.mime), url=URL.createObjectURL(blob); S.media.set("own:"+r.drive_id, url);
    const c={ cid:"avatar:"+r.drive_id, source:"AI avatar", kind:"photo", drive_id:r.drive_id, desc:`AI shot: ${body.names}${av.action?" – "+av.action:""}${av.props.length?" (with "+av.props.join(", ")+")":""}`.slice(0,240),
      licence:"AI-generated (Google Gemini)", credit:"", ai_ok:true, thumbnail:await smallThumb(url), local_url:url, cast_ids:av.cast_ids.slice(), made_by:S.email };
    sc.candidates=[c, ...(sc.candidates||[])]; sc.footage=c; sc.approved=false; sc.card=false;
    aiSpend().images++; invalidate(); saveLocal(); updateCredits();
    toast("Shot created. Check it, then Approve & use, or Animate it.");
  }catch(e){ toast(e.message); }

async function animateShot(i, cid, secs){
  const sc=S.job.scenes[i], av=scAv(sc), c=(sc.candidates||[]).find(x=>x.cid===cid);
  if(!c || av.pending) return;
  av.pending={ operation:"", seconds:secs, from:cid, at:Date.now() }; openShot(i);
  try{
    const img=await toJpegB64(await driveUrl(c.drive_id),1280,0.92);
    const r=await api("shot_video",{ image:{mime:img.mime,data:img.data}, seconds:secs, what:av.action, props:av.props.join(", "), camera:av.camera });
    if(!r || !r.ok || !r.operation) throw new Error((r&&r.error)||"Couldn't start the animation");
    av.pending.operation=r.operation; saveLocal(); pollShot(sc.id);
    toast("Animating… you can keep working; it appears in this scene when ready.");
  }catch(e){ av.pending=null; saveLocal(); toast(e.message); }
  if(SHOT.i===i) openShot(i); else renderScenes();
}
async function pollShot(scId){
  if(CAST.polling.has(scId)) return; CAST.polling.add(scId);
  const jobId=S.jobId;
  try{
    for(let k=0;k<60;k++){
      await sleep(10000);
      if(S.jobId!==jobId || !S.job) return;
      const sc=S.job.scenes.find(s=>s.id===scId); const av=sc&&sc.avatar; if(!av||!av.pending||!av.pending.operation) return;
      let r; try{ r=await api("shot_status",{operation:av.pending.operation}); }catch(e){ continue; }
      if(!r || !r.done) continue;
      const p=av.pending; av.pending=null;
      if(r.ok && r.drive_id){
        const still=(sc.candidates||[]).find(x=>x.cid===p.from)||{};
        const v={ cid:"avatar:"+r.drive_id, source:"AI avatar", kind:"video", drive_id:r.drive_id, duration:p.seconds, desc:(still.desc||"AI video").replace(/^AI shot/,"AI video").slice(0,240),
          licence:"AI-generated (Google Gemini)", credit:"", ai_ok:true, thumbnail:still.thumbnail||"", cast_ids:still.cast_ids||[], made_by:S.email };
        sc.candidates=[v, ...(sc.candidates||[])]; sc.footage=v; sc.approved=false; sc.card=false;
        aiSpend().video_sec+=p.seconds; invalidate(); saveLocal(); renderScenes(); updateCredits();
        toast(`Scene ${S.job.scenes.indexOf(sc)+1}: the animated shot is ready. Check it and approve it.`);
      } else { saveLocal(); renderScenes(); toast("Animation failed: "+((r&&r.error)||"unknown error")); }
      const i=S.job.scenes.indexOf(sc); if(SHOT.i===i) openShot(i);
      return;
    }
    toast("The animation is taking unusually long. It will be checked again when you reopen this video.");
  } finally { CAST.polling.delete(scId); }
}
function resumeShotPolls(){ if(!S.job) return; S.job.scenes.forEach(sc=>{ if(sc.avatar && sc.avatar.pending){ if(sc.avatar.pending.operation) pollShot(sc.id); else sc.avatar.pending=null; } }); }

  if(f.type==="select"){ const o=(f.options||[]).map(String); const s2=/^(none|same|default|same as video)$/i.test(s)&&o.includes("")?"":s; const hit=o.find(x=>x.toLowerCase()===s2.toLowerCase()); return hit===undefined?undefined:(f.numeric?+hit:hit); }
  if(f.type==="bool") return /^(true|yes|on|1)$/i.test(s);
  if(f.rawType==="colorNone"){ if(!s || /^(none|transparent|no|off|null|remove)$/i.test(s)) return ""; return toHex(s); }
  if(f.type==="color") return toHex(s);
  if(f.type==="text"){ return f.max? s.slice(0,f.max) : s; }
  return s;
}

function mountChat(host, key, def){

function refreshChat(key){

function bindChat(box, key){
  const st=S.chats[key]=S.chats[key]||{open:false,msgs:[],draft:""};
  const def=S.chatDefs[key];
  const q=sel=>box.querySelector(sel);
  if(q("[data-aiopen]")) q("[data-aiopen]").onclick=()=>{ st.open=true; refreshChat(key); const t=document.querySelector(`.aihost[data-key="${CSS.escape(key)}"] textarea`); if(t) t.focus(); };
  if(q("[data-aiclose]")) q("[data-aiclose]").onclick=()=>{ st.open=false; refreshChat(key); };
  if(q("[data-aiclear]")) q("[data-aiclear]").onclick=()=>{ st.msgs=[]; refreshChat(key); };
  const ta=q("textarea");
  if(ta){ ta.oninput=()=>{ st.draft=ta.value; }; ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendChat(key, ta.value); } }; }
  const f=q("[data-aiform]"); if(f) f.onsubmit=e=>{ e.preventDefault(); sendChat(key, ta.value); };
  box.querySelectorAll("[data-aihint]").forEach(b=>b.onclick=()=>sendChat(key,b.dataset.aihint));
  box.querySelectorAll("[data-aiskip]").forEach(b=>b.onclick=()=>{ st.msgs[+b.dataset.aiskip].applied="skipped"; refreshChat(key); });
  box.querySelectorAll("[data-aiapply]").forEach(b=>b.onclick=()=>{
    const mi=+b.dataset.aiapply, m=st.msgs[mi]; const fields=S.chatDefs[key].fields(); const fmap=Object.fromEntries(fields.map(x=>[x.key,x]));
    const chosen=[...box.querySelectorAll(`[data-aisel^="${mi}:"]`)].filter(x=>x.checked).map(x=>m.changes.filter(c=>fmap[c.key])[+x.dataset.aisel.split(":")[1]]);
    if(!chosen.length){ toast("Tick at least one change"); return; }
    const undo=[], applied=[];
    chosen.sort((a,b)=>(fmap[a.key].late||0)-(fmap[b.key].late||0));
    for(const c of chosen){ const fd=fmap[c.key]; const v=coerce(fd,c.value); if(v===undefined) continue; if(!fd.late) undo.push([c.key,fd.get()]); fd.set(v); applied.push(c.key); }
    m.applied=true; m.undo=undo; m.before=Object.fromEntries(m.changes.filter(c=>fmap[c.key]).map(c=>[c.key,fmap[c.key].get()])); undo.forEach(([k,v])=>{ m.before[k]=v; }); saveLocal();
    S.chatDefs[key].after(applied);
    if(S._fontsDirty) styleChanged();
    refreshChat(key);
    toast(`Applied ${applied.length} change${applied.length===1?"":"s"}`);
  });
  box.querySelectorAll("[data-aiundo]").forEach(b=>b.onclick=()=>{
    const m=st.msgs[+b.dataset.aiundo]; const fmap=Object.fromEntries(S.chatDefs[key].fields().map(x=>[x.key,x]));
    const keys=[]; for(const [k,v] of (m.undo||[]).slice().reverse()){ if(fmap[k]){ fmap[k].set(v); keys.push(k); } }
    m.applied="undone"; m.undo=null; saveLocal(); S.chatDefs[key].after(keys); refreshChat(key); toast("Undone");
  });
  const list=q(".aimsgs"); if(list) list.scrollTop=list.scrollHeight;
}
async function sendChat(key, text, prompt){
  text=String(text||"").trim(); const st=S.chats[key]; const def=S.chatDefs[key];
  if(!text||st.busy) return;
  st.msgs.push(prompt?{role:"user",text,prompt}:{role:"user",text}); st.draft=""; st.busy=true; refreshChat(key);
  try{
    const fields=def.fields().map(f=>({key:f.key,label:f.label+(f.note?` (${f.note})`:""),type:f.type==="bool"?"true/false":f.type,min:f.min,max:f.max,options:f.options}));
    const current=Object.fromEntries(def.fields().map(f=>[f.key,f.get()]));
    const body={ scope:def.title, max_changes:def.maxChanges||8, context:Object.assign({current_values:current}, def.context()), fields,
      messages: st.msgs.slice(-14).map(m=>({role:m.role, text:m.role==="ai"&&m.changes&&m.changes.length? m.text+"\n[suggested: "+m.changes.map(c=>c.key+"="+c.value).join(", ")+(m.applied===true?" — user applied":m.applied?" — user did not apply":"")+"]" : (m.prompt||m.text)})) };
    if(def.image){ const im=snapshot(); if(im) body.image=im; }
    if(def.images){ const ims=await def.images(); if(ims.length){ body.images=ims.map(x=>x.b64); body.image_labels=ims.map(x=>x.label); } }
    const r=await api("assist", body);
    st.msgs.push({role:"ai", text:r.reply||"(no answer)", changes:Array.isArray(r.changes)?r.changes:[]});
  }catch(e){ st.msgs.push({role:"ai", text:"Sorry, I couldn't reach the AI: "+e.message, changes:[]}); }
  st.busy=false; refreshChat(key);
}

// ================================================================ AI VISUAL FIT (match each scene's footage to its narration and title)
const FIT_PROMPT = `Check whether this scene's visuals actually show what its narration and on-screen title say.
FRAME images are from the current clip (full source frames; the video shows a 9:16 crop of them). PREVIEW is the rendered 9:16 frame with the title and captions as they look now. CANDIDATE images are other footage choices for this scene.
Reply format: start with "VERDICT: good" or "VERDICT: weak" or "VERDICT: wrong", then " · SCORE: n/10", then 1-3 short sentences: what is visible, and whether it fits the text.
Then propose changes only where they clearly help:
- start: the clip time (from a FRAME label) that best shows what the narration talks about;
- zoom / panX / panY so the subject named in the text sits inside the 9:16 crop and is not covered by the title (top area) or the captions (lower middle);
- motion that suits the line; transition only if the current one jars;
- titlePos away from the subject; titleSize if the title is cramped;
- bright / contrast / sat / warmth only for clear problems (too dark, washed out, colour cast);
- title: only if the visible subject clearly differs from the title, and keep it truthful (1-4 words);
- footage_cid: a CANDIDATE that clearly shows the place in the text better (say why). Never pick footage of a different place.
If the scene already fits well, say so and return few or no changes.`;
async function frameB64(src, w, h, maxSide){
  const k=Math.min(1, maxSide/Math.max(w||1,h||1)); const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height); return c.toDataURL("image/jpeg",0.72).split(",")[1]||"";
}
async function fitImages(i, nCand){
  const sc=S.job.scenes[i], a=ASSETS.get(sc.id)||{}, P=R.prepared, ps=P&&P.scenes[i]; const out=[];
  try{
    if(a.video){
      const v=a.video, len=v.duration||0, n=len>8?6:len>3?4:2;
      for(let k=0;k<n;k++){ const t=Math.max(0,Math.min(len-0.1,(len*(k+0.5))/n)); await seek(v,t);
        out.push({label:`FRAME ${k+1}: current clip at ${t.toFixed(1)}s of ${len.toFixed(1)}s (full source frame ${v.videoWidth}x${v.videoHeight})`, b64:await frameB64(v,v.videoWidth,v.videoHeight,384)}); }
    } else if(a.image){
      out.push({label:`PHOTO: the current scene photo (full source ${a.image.naturalWidth}x${a.image.naturalHeight}; shown as a 9:16 crop with slow motion)`, b64:await frameB64(a.image,a.image.naturalWidth,a.image.naturalHeight,448)});
    }
    if(ps){ await scrubTo(ps.t0+Math.min(ps.dur*0.45,2.2)); const pv=snapshot(); if(pv) out.push({label:"PREVIEW: current rendered 9:16 frame with the title and captions", b64:pv}); }
  }catch(e){}
  const cands=(sc.candidates||[]).filter(c=>!c._rejected && !(sc.footage&&c.cid===sc.footage.cid) && (c.thumbnail||c.local_thumb)).slice(0,nCand==null?5:nCand);
  for(const c of cands){
    try{ const blob = c.local_thumb ? await (await fetch(c.local_thumb)).blob() : await api("media",{url:c.thumbnail},true);
      const bm=await createImageBitmap(blob);
      out.push({label:`CANDIDATE footage_cid=${c.cid} (${c.kind} from ${c.source}${c.verified?", approved before for this place":""}): ${String(c.desc||"").slice(0,120)}`, b64:await frameB64(bm,bm.width,bm.height,256)});
    }catch(e){}
  }
  return out;
}
function fitDef(i){
  const sc=()=>S.job.scenes[i], clipD=editDef(0,i), lookD=editDef(1,i);
  return { kind:"clip", title:`scene ${i+1} visuals vs text`, image:false, images:()=>fitImages(i),
    fields:()=>{ const f=[...clipD.fields(), ...lookD.fields()]; const fc=sceneFields(sc()).find(x=>x.key==="footage_cid"); if(fc) f.push(Object.assign({},fc,{label:"Swap to CANDIDATE footage (footage_cid from a CANDIDATE label)"})); return f; },
    context:()=>clipD.context(),
    after:(keys)=>{ if(keys.includes("footage_cid")){ invalidate(); renderScenes(); updateCredits(); toast("Footage swapped. Approve it in Scenes & footage, then Prepare again."); return; } relayout(); renderEditor(); } };
}
function fitVerdict(key){
  const st=S.chats[key]; if(!st) return null; const m=[...st.msgs].reverse().find(x=>x.role==="ai"); if(!m) return st.busy?{v:"checking"}:null;
  const v=(m.text.match(/VERDICT:\s*(good|weak|wrong)/i)||[])[1]; const s=(m.text.match(/SCORE:\s*(\d+)/i)||[])[1];
  return {v:v?v.toLowerCase():"?", s:s?+s:null};
}
function renderFitReport(){
  const box=$("#fitReport"); if(!box||!S.job) return;
  const rows=S.job.scenes.map((sc,i)=>({sc,i,key:"fit:"+sc.id})).filter(r=>S.chats[r.key]);
  if(!rows.length){ box.innerHTML=""; return; }
  const pending=rows.filter(r=>{ const st=S.chats[r.key]; const m=[...st.msgs].reverse().find(x=>x.role==="ai"); return m&&!m.applied&&(m.changes||[]).length; }).length;
  box.innerHTML=`<div class="fithead"><b>AI fit report</b><span class="small muted">${rows.length} scene${rows.length===1?"":"s"} checked</span>${pending?`<button class="btn-sm primary" id="fitApplyAll">Apply all suggested fixes (${pending} scene${pending===1?"":"s"})</button>`:""}<button class="linkish" id="fitClear">Clear report</button></div>`+
    rows.map(r=>{ const fv=fitVerdict(r.key)||{}; const cls=fv.v==="good"?"ok":fv.v==="wrong"?"bad":fv.v==="weak"?"warn":"";
      return `<div class="fitrow"><div class="fitlab"><button class="linkish" data-fitgo="${r.i}">Scene ${r.i+1} · ${esc(r.sc.location||"")}</button> <span class="pill ${cls}">${fv.v==="checking"?"checking…":fv.v?esc(fv.v)+(fv.s!=null?" · "+fv.s+"/10":""):""}</span></div><div class="aihost" data-key="${esc(r.key)}"></div></div>`; }).join("");
  box.querySelectorAll(".aihost").forEach(h=>{ const i=S.job.scenes.findIndex(s=>"fit:"+s.id===h.dataset.key); if(i>=0) mountChat(h,h.dataset.key,S.chatDefs[h.dataset.key]||fitDef(i)); });
  box.querySelectorAll("[data-fitgo]").forEach(b=>b.onclick=()=>{ S.editSel=+b.dataset.fitgo; R.scrub=R.prepared.scenes[S.editSel].t0+0.3; renderEditor(); });
  const ap=$("#fitApplyAll"); if(ap) ap.onclick=applyAllFit;
  const cl=$("#fitClear"); if(cl) cl.onclick=()=>{ S.job.scenes.forEach(sc=>{ delete S.chats["fit:"+sc.id]; }); renderFitReport(); };
}
function applyAllFit(){
  let n=0, swaps=0;
  S.job.scenes.forEach((sc,i)=>{
    const key="fit:"+sc.id, st=S.chats[key]; if(!st) return; const m=[...st.msgs].reverse().find(x=>x.role==="ai"); if(!m||m.applied||!(m.changes||[]).length) return;
    const def=S.chatDefs[key]||fitDef(i); const fmap=Object.fromEntries(def.fields().map(f=>[f.key,f])); const undo=[], before={};
    for(const c of m.changes){ const f=fmap[c.key]; if(!f) continue; if(c.key==="footage_cid"){ swaps++; continue; } const v=coerce(f,c.value); if(v===undefined) continue; before[c.key]=f.get(); undo.push([c.key,f.get()]); f.set(v); n++; }
    m.applied=true; m.undo=undo; m.before=before;
  });
  saveLocal(); relayout(); renderEditor();
  toast(`Applied ${n} fix${n===1?"":"es"}${swaps?`. ${swaps} footage swap${swaps===1?"":"s"} left for you to decide`:""}.`);
}
async function runFit(indices){
  if(S.fitBusy||!R.prepared) return; if(R.playing) stopPlayback();
  S.fitBusy=true; const keep=R.scrub||0; const todo=indices.filter(i=>!S.job.scenes[i].card);
  try{
    for(let k=0;k<todo.length;k++){
      const i=todo[k], key="fit:"+S.job.scenes[i].id;
      S.chats[key]={open:true,msgs:[],draft:""}; S.chatDefs=S.chatDefs||{}; S.chatDefs[key]=fitDef(i);
      S.fitStatus=`Checking scene ${i+1} (${k+1} of ${todo.length})…`; const fs=$("#fitStatus"); if(fs) fs.textContent=S.fitStatus;
      renderFitReport();
      await sendChat(key, "Check how this scene's visuals fit its narration and title.", FIT_PROMPT);
      renderFitReport();
    }
    S.fitStatus=`Checked ${todo.length} scene${todo.length===1?"":"s"}. Review the suggestions below.`;
  }finally{ S.fitBusy=false; const fs=$("#fitStatus"); if(fs) fs.textContent=S.fitStatus||""; await scrubTo(keep); renderFitReport(); }
}

// ================================================================ AI DIRECTOR (one chat that can change anything in the video)
const SCENE_AUDIO_KEYS = new Set(["voiceVol","narration","delivery"]);
const DIRECTOR_PROMPT_NOTE = "Keys starting with sN. belong to scene N (scene numbers as they are now). Global keys apply to the whole video. Action keys (scene_order, sN.remove, sN.find_footage, music_search, translate_to) do something rather than set a value; only use them when the user asks for that. People: CONTEXT.video.people_available lists real people and AI influencers. To put someone in a scene set sN.avatar_people, sN.avatar_action, sN.avatar_props (equipment/tools they use), sN.avatar_framing; this only sets up the shot (no cost) and the user then presses Create shot. Use sN.avatar_speaks or narrator to have a person speak in their own voice.";
function directorFields(){
  if(!S.job) return [];
  const out=[], n=S.job.scenes.length;
  const pref=(f,i)=>Object.assign({},f,{key:`s${i+1}.${f.key}`, label:`Scene ${i+1}: ${f.label}`, sceneIdx:i});
  S.job.scenes.forEach((sc,i)=>{
    editDef(0,i).fields().forEach(f=>out.push(pref(f,i)));
    editDef(1,i).fields().forEach(f=>out.push(pref(f,i)));
    editDef(2,i).fields().filter(f=>SCENE_AUDIO_KEYS.has(f.key)).forEach(f=>out.push(pref(f,i)));
    avatarFields(i).forEach(f=>out.push(pref(f,i)));
    out.push({key:`s${i+1}.find_footage`, label:`Scene ${i+1}: search all sources for new footage (search words)`, type:"text", max:60, get:()=>"", set:v=>{ if(v){ S.openAlts[i]=true; searchMore(i, v, {disabled:false,textContent:""}); } }, late:1, sceneIdx:i});
    out.push({key:`s${i+1}.remove`, label:`Scene ${i+1}: delete this scene (true to delete)`, type:"bool", get:()=>false, set:v=>{ const k=S.job.scenes.indexOf(sc); if(v && S.job.scenes.length>1 && k>=0){ S.job.scenes.splice(k,1); } }, late:3-i/100, sceneIdx:i});
  });
  editDef(2,0).fields().filter(f=>!SCENE_AUDIO_KEYS.has(f.key)).forEach(f=>out.push(Object.assign({},f)));
  editDef(3,0).fields().forEach(f=>out.push(Object.assign({},f)));
  captionDef().fields().forEach(f=>out.push(Object.assign({},f)));
  out.push({key:"scene_order", label:`New scene order as comma-separated current scene numbers, e.g. 2,1,3 (all ${n} numbers)`, type:"text", max:60,
    get:()=>S.job.scenes.map((_,k)=>k+1).join(","),
    set:v=>{ const nums=String(v).split(/[^0-9]+/).filter(Boolean).map(x=>+x-1); const cur=S.job.scenes.slice(); if(nums.length!==cur.length||new Set(nums).size!==cur.length||nums.some(x=>x<0||x>=cur.length)) return; S.job.scenes=nums.map(x=>cur[x]); }, late:2});
  out.push({key:"narrator", label:"Narrator for the whole video: a person's own voice (name), or empty for the normal voice", type:"select", options:["",...castActive().filter(m=>m.voice_id).map(m=>m.name)], get:()=>(castById(S.job.narrator_cast||"")||{}).name||"", set:v=>{ const m=castActive().find(x=>x.name===v); S.job.narrator_cast=m?m.cast_id:""; setTimeout(renderNarr,0); }});
  out.push({key:"music_search", label:"Search the free music library (1-2 words, e.g. sitar, calm flute); opens the results to choose from", type:"text", max:40, get:()=>"", set:v=>{ if(v){ MUSIC.q=v; MUSIC.results=[]; S._openMusicAfter=true; } }, late:1});
  out.push({key:"translate_to", label:"Translate the whole script to another language and switch the voice to it", type:"select", options:ALL_LANGS.map(l=>l[0]), get:()=>scriptLang(), set:v=>{ if(v && v!==scriptLang()){ setVC({lang:v}); S._translateAfter=true; } }, late:1});
  return out;
}
function directorDef(){
  return { kind:"director", title:"the whole video", image:true, maxChanges:40,
    fields:directorFields,
    context:()=>({ note:DIRECTOR_PROMPT_NOTE, video:jobBrief(), prepared:!!R.prepared, total_seconds:R.prepared?+R.prepared.total.toFixed(1):null,
      scenes_detail:S.job.scenes.map((s,i)=>({n:i+1, location:s.location, card:!!s.card, approved:!!s.approved, footage:s.footage&&!s.card?`${s.footage.kind} from ${s.footage.source}: ${String(s.footage.desc||"").slice(0,100)}`:"title card", other_choices:(s.candidates||[]).filter(c=>!c._rejected).length})) }),
    after:(keys)=>{
      const big = keys.some(k=>/\.(narration|remove|avatar_speaks)$|^(narrator|narration|voice|stylePreset|pace|voiceAccent|voiceDirection|translate_to|scene_order)$/.test(k) || /\.footage_cid$/.test(k));
      if(S._translateAfter){ S._translateAfter=false; translateScript({disabled:false,textContent:""}).catch(()=>{}); }
      if(S._openMusicAfter){ S._openMusicAfter=false; setTimeout(openMusic,50); }
      const c=$("#caption"); if(c) c.value=captionText();
      if(big){ invalidate(); renderScenes(); updateCredits(); if(keys.some(k=>/narration|voice|stylePreset|pace|Accent|Direction|translate/.test(k))) toast("Press Prepare again to hear the changes."); }
      else { renderScenes(); if(R.prepared){ relayout(); renderEditor(); } }
      mountDirector();
    } };
}
function mountDirector(){
  document.querySelectorAll('.aihost[data-key="director"]').forEach(h=>mountChat(h,"director",directorDef()));
}

boot();
</script>
