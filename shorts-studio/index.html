<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts Studio · NegoTrip</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<meta name="theme-color" content="#1B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#E8EAF1; --ink:#1B1F3A; --ink-2:#565B7A; --line:#D9DCE6;
  --accent:#A8321E; --accent-ink:#FFFFFF; --gold:#C98A12; --ok:#2F7D6B; --warn:#B7791F; --danger:#B3261E; --scrim:rgba(16,18,42,.45);
  --shadow:0 1px 2px rgba(27,31,58,.06),0 4px 14px rgba(27,31,58,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10122A; --surface:#1A1D3A; --surface-2:#23274A; --ink:#ECEDF7; --ink-2:#A3A7C6; --line:#2E3358;
    --accent:#E0654E; --accent-ink:#10122A; --gold:#E9B24A; --ok:#4DB39A; --warn:#E9B24A; --danger:#F08070; --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10122A; --surface:#1A1D3A; --surface-2:#23274A; --ink:#ECEDF7; --ink-2:#A3A7C6; --line:#2E3358;
  --accent:#E0654E; --accent-ink:#10122A; --gold:#E9B24A; --ok:#4DB39A; --warn:#E9B24A; --danger:#F08070; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:#1B1F3A;display:grid;place-items:center;flex:none}
.mark svg{width:28px;height:28px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1;margin:2px 0 0;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.me a{font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px}

.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}

.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:12px;color:var(--ink-2);margin-top:4px}
input[type=file]{max-width:100%;font-size:13px}
input[type=text],input[type=number],select,textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;padding:10px 12px}
input[type=text],select{height:44px;padding-block:0}
textarea{min-height:74px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:44px;padding:0 18px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn-sm{height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-sm.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.jobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.jobs button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.jobs button[aria-current="true"]{border-color:var(--accent)}
.jobs .jt{font-weight:600;font-size:13.5px;line-height:1.25}
.jobs .jd{font-size:11.5px;color:var(--ink-2);font-family:var(--mono)}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

.empty{text-align:center;padding:40px 18px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;text-align:left}
@media (max-width:640px){.steps3{grid-template-columns:1fr}}
.steps3 div{background:var(--bg);border-radius:12px;padding:12px;font-size:13px}
.steps3 b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}

.progress{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.progress li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.progress li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.progress li.done{color:var(--ink)} .progress li.done i{background:var(--ok);border-color:var(--ok)}
.progress li.now{color:var(--ink);font-weight:600} .progress li.now i{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress li.now i{animation:none}}

.jobhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.jobhead h2{font-size:24px;font-weight:800;margin:2px 0 4px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.checks input{width:17px;height:17px;margin-top:2px;accent-color:var(--accent);flex:none}

.scenes{display:flex;flex-direction:column;gap:12px}
.scene{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
@media (max-width:560px){.scene{grid-template-columns:86px minmax(0,1fr)}}
.thumb{width:100%;aspect-ratio:9/16;border-radius:10px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;font-size:11px;color:var(--ink-2);text-align:center;overflow:hidden}
.scene .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.scene .loc{font-weight:700;font-size:14px;margin-right:4px}
.scene textarea{min-height:60px;font-size:14px}
.scene .row2{grid-template-columns:1fr 90px}
.scene .field{margin-bottom:8px}
img.thumb{display:block;object-fit:cover;width:100%;aspect-ratio:9/16;height:auto}
.thumbbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:10px}
.thumbbtn:disabled{cursor:default}
.thumbbtn .play{position:absolute;inset:auto auto 8px 8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:12px}
.ph{display:grid;place-items:center;text-align:center;font-size:11px;color:var(--ink-2);background:var(--surface-2)}
.picker{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.alts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.alt{position:relative;border:2px solid transparent;border-radius:10px;padding:0;background:var(--surface-2);cursor:pointer;overflow:hidden;text-align:left}
.alt[aria-pressed="true"]{border-color:var(--accent)}
.alt img,.alt .ph{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.alt .tag{position:absolute;left:4px;bottom:4px;right:4px;font-size:10px;font-weight:600;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt .tag.dim{bottom:auto;top:4px;background:rgba(0,0,0,.45);font-weight:500}
.searchrow{display:flex;gap:8px;margin-bottom:8px}
.searchrow input{height:34px;font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:16px;box-shadow:var(--shadow)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mstage{background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:200px;max-height:60vh}
.mstage img,.mstage video{max-width:100%;max-height:60vh;display:block}
.modal select{height:44px;border-radius:11px;width:auto}

.render{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
@media (max-width:760px){.render{grid-template-columns:1fr}}
.stage{position:relative;width:100%;max-width:300px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;margin-inline:auto}
.stage canvas,.stage video{width:100%;height:100%;display:block}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.log{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);min-height:18px}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent);margin-top:10px}
.notice.bad{background:color-mix(in srgb,var(--danger) 14%,transparent)}

.gate{min-height:70vh;display:grid;place-items:center}
.gate .card{max-width:440px;text-align:center;padding:28px 22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* editor */
.editor{border-top:1px solid var(--line);margin-top:16px;padding-top:6px}
.editor h3{font-family:var(--display);font-size:17px;margin:0 0 10px}
.scrubrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.scrubrow input{flex:1;accent-color:var(--accent)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip2{flex:0 0 78px;display:flex;flex-direction:column;gap:4px}
.chip2 .pick{border:2px solid transparent;border-radius:10px;padding:0;background:var(--bg);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;color:var(--ink)}
.chip2 .pick img,.chip2 .pick .ph{display:block;width:100%;aspect-ratio:9/16;object-fit:cover}
.chip2 .pick span{font-size:11px;font-family:var(--mono);padding:3px 0}
.chip2.on .pick{border-color:var(--accent)}
.chip2 .mv{display:flex;gap:4px}.chip2 .mv button{flex:1;height:26px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:11px}
.chip2 .mv button:disabled{opacity:.35;cursor:default}
.tabs2{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs2 button{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
.tabs2 button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.insp{background:var(--bg);border-radius:12px;padding:14px}
.rng{margin-bottom:10px}.rng label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:2px}
.rng output{font-family:var(--mono);font-weight:400;color:var(--ink-2);font-size:12px}
.rng input{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
/* AI co-editor */
.aihost{margin-top:10px}
.aibtn{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:9px;height:32px;padding:0 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.aichat.open{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px}
.aihead{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px}
.linkish{background:none;border:0;color:var(--ink-2);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.aimsgs{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.aimsg{padding:8px 10px;border-radius:10px;font-size:13.5px;line-height:1.45;max-width:92%}
.aimsg.me{align-self:flex-end;background:var(--ink);color:var(--surface)}
.aimsg.ai{align-self:flex-start;background:var(--bg)}
.aimsg.typing{color:var(--ink-2);font-style:italic}
.aich{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.aich label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.aich label.done{opacity:.6}
.aich .btn-sm,.aich .btns{align-self:flex-start}
.aihints{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.aihint{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;font-size:12px;padding:5px 10px;cursor:pointer}
.aiform{display:flex;gap:6px;align-items:flex-end}
.aiform textarea{flex:1;min-height:40px;font-size:14px;resize:vertical}
/* free music */
.mlist{display:flex;flex-direction:column;gap:6px;max-height:min(56vh,520px);overflow:auto;margin-top:8px}
.mrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.mrow.on{border-color:var(--ok)}
.mplay{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-size:13px}
.minfo{min-width:0}.minfo .mt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.mrow{grid-template-columns:36px minmax(0,1fr) auto}.mrow .pill{display:none}}
/* voice & language */
.vsum{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.4}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.vlist{display:flex;flex-direction:column;gap:6px;max-height:min(46vh,440px);overflow:auto}
.vrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.vrow.on{border-color:var(--ok)}
.vdesc{white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aihint.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* AI visual fit */
.fitbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.fitbar .small{flex:1 1 220px;min-width:0}
#fitReport{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
#fitReport:empty{display:none}
.fithead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fitrow{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.fitlab{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px}
.fitrow .aihost{margin-top:6px}
/* AI director */
.director .aichat.open{background:var(--bg)}
.director .aimsgs{max-height:420px}
/* text, colours & brand */
.sgroup{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.sgroup summary{cursor:pointer;font-weight:700;font-size:13.5px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 12px;margin-top:8px;align-items:end}
.sgrid .wide{grid-column:1/-1}
.sgrid .chk{display:flex;gap:6px;align-items:center;min-height:32px}
.sgrid .field{margin:0}.sgrid .rng{margin:0}
.cn{display:flex;gap:8px;align-items:center}.cn input[type=color]{flex:1}
/* saving + library */
.jobhead{flex-wrap:wrap}
.namein{font-family:var(--display);font-weight:600;font-size:19px;border:1px solid transparent;background:transparent;color:var(--ink);padding:2px 6px;margin:2px 0 2px -6px;border-radius:8px;width:100%;max-width:520px}
.namein:hover,.namein:focus{border-color:var(--line);background:var(--bg)}
.libbar{display:flex;gap:6px;margin-bottom:8px}.libbar input{flex:1;min-width:0;height:34px;font-size:13px;padding:6px 10px}.libbar select{width:auto;height:34px;font-size:13px;padding:4px 8px}
.jobs .jrow{display:flex;gap:4px;align-items:stretch}
.jobs .jrow>button[data-job]{flex:1;min-width:0;justify-content:flex-start;gap:10px}
.jobs .jtx{min-width:0;overflow:hidden}.jobs .jt{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobs .jth{width:36px;height:54px;border-radius:6px;object-fit:cover;flex:0 0 36px;background:var(--surface-2)}
.jobs .jarch{width:34px;border:1px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink)}
.jobs .jrow .pill{margin-top:3px;display:inline-block}
.jobs{max-height:560px}
/* people (cast) + AI shots */
.jobs .jrow>button[data-cast]{flex:1;min-width:0;justify-content:flex-start;gap:10px}
.modal-card.wide{max-width:660px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.sec h3{font-family:var(--display);font-size:16px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,120px));gap:8px}
.look{display:flex;flex-direction:column;gap:4px;border:2px solid transparent;border-radius:10px;padding:0;background:var(--surface-2);cursor:pointer;overflow:hidden;color:var(--ink)}
.look img,.look .ph{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.look[aria-pressed="true"]{border-color:var(--accent)}
div.look{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.consent{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.recbox{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.quote{background:var(--surface);border-left:3px solid var(--accent);padding:8px 10px;border-radius:8px;font-size:13.5px;line-height:1.45}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pp{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg);cursor:pointer}
.pp:has(input:checked){border-color:var(--accent)}
.pp .jth{width:30px;height:46px;border-radius:6px;object-fit:cover;flex:0 0 30px;background:var(--surface-2)}
.bgpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.shots{display:flex;flex-direction:column;gap:10px}

.shot.on .alt{border-color:var(--accent)}

.ready .no{color:var(--danger)} .ready .yes{color:var(--ok)}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#E9B24A" stroke-width="2.4"/><circle cx="16" cy="16" r="4.2" fill="#E0654E"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5" stroke="#E9B24A" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      <div><div class="eyebrow">NegoTrip HQ</div><h1>Shorts Studio</h1></div>
    </div>
    <div class="me" id="me"></div>
  </header>
  <main id="app"><div class="gate"><p class="muted">Loading…</p></div></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------- config
const SUPABASE_URL = "https://wbynfjiaxpcoxthfuusk.supabase.co";
const SUPABASE_KEY = "sb_publishable_9LY7RvJpP7wY8rxp8edMmQ_eT-FcbuC"; // public browser key (same as NegoTrip HQ)
const API = "https://n8n.assignover.in/webhook/shorts-studio-api";
const HQ_URL = new URL("../", location.href).href;
const VOICES = [
  ["Kore","Kore · female, firm"],["Aoede","Aoede · female, breezy"],["Sulafat","Sulafat · female, warm"],["Leda","Leda · female, youthful"],
  ["Zephyr","Zephyr · female, bright"],["Despina","Despina · female, smooth"],["Puck","Puck · male, upbeat"],["Charon","Charon · male, informative"],
  ["Orus","Orus · male, firm"],["Iapetus","Iapetus · male, clear"],["Fenrir","Fenrir · male, excitable"],["Algieba","Algieba · male, smooth"]
];
const ANGLES = ["Discovery","Spiritual","Beach","Heritage","Weekend getaway","Hidden places","Budget","Food & culture","Family","Honeymoon"];
const LANGS = ["English","Hindi","Odia","Bengali","Tamil","Telugu","Marathi","Gujarati","Kannada","Malayalam","Punjabi","Assamese","Urdu","Spanish","French","German","Italian","Portuguese","Russian","Arabic","Japanese","Korean","Chinese","Thai","Indonesian"];
const NAME2CODE = {English:"en-IN",Hindi:"hi-IN",Odia:"or-IN",Bengali:"bn-IN",Tamil:"ta-IN",Telugu:"te-IN",Marathi:"mr-IN",Gujarati:"gu-IN",Kannada:"kn-IN",Malayalam:"ml-IN",Punjabi:"pa-IN",Assamese:"as-IN",Urdu:"ur-IN",Spanish:"es-ES",French:"fr-FR",German:"de-DE",Italian:"it-IT",Portuguese:"pt-BR",Russian:"ru-RU",Arabic:"ar-XA",Japanese:"ja-JP",Korean:"ko-KR",Chinese:"cmn-CN",Thai:"th-TH",Indonesian:"id-ID"};

const sb = window.supabase && window.supabase.createClient
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}})
  : null;

// ---------------------------------------------------------------- tiny helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3500); }
const store = {
  get(k, d){ try{ const v=localStorage.getItem("shorts."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("shorts."+k, JSON.stringify(v)); }catch(e){} }
};
// IndexedDB for remembered logo / music files (optional; the app works without it)
const idb = {
  db:null,
  async open(){ if(this.db) return this.db; return this.db = await new Promise((res,rej)=>{ const r=indexedDB.open("shorts-studio",1); r.onupgradeneeded=()=>r.result.createObjectStore("files"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{ const q=db.transaction("files").objectStore("files").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db=await this.open(); await new Promise(res=>{ const tx=db.transaction("files","readwrite"); v==null?tx.objectStore("files").delete(k):tx.objectStore("files").put(v,k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
};

// ---------------------------------------------------------------- API
async function token(){
  if(!sb) throw Object.assign(new Error("Sign-in library failed to load."),{code:"no_sb"});
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw Object.assign(new Error("Please sign in."),{code:"signed_out"});
  return session.access_token;
}
async function api(action, payload={}, asBlob=false){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer "+await token()}, body:JSON.stringify({action, ...payload})});
  if(r.status===403) throw Object.assign(new Error("Your account doesn't have Shorts Studio yet."),{code:"not_allowed"});
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){} throw new Error(m || ("Server error "+r.status)); }
  return asBlob ? r.blob() : r.json();
}

// ---------------------------------------------------------------- state
const S = { email:"", jobs:[], jobId:null, job:null, pollStart:0, pollTimer:null, checks:{}, openAlts:{}, media:new Map(), voices:new Map(), result:null, busy:false };

// ---------------------------------------------------------------- boot
async function boot(){
  if(!sb){ gate("Couldn't load the sign-in library. Check your connection and reload."); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ gateSignIn(); return; }
  S.email = session.user.email || "";
  $("#me").innerHTML = `<span>${esc(S.email)}</span><a href="${esc(HQ_URL)}">← HQ</a>`;
  try{ await loadJobs(); }
  catch(e){ if(e.code==="not_allowed"){ gate("Your account doesn't have Shorts Studio yet. Ask the owner to give you the Shorts Studio tool in NegoTrip HQ."); return; } if(e.code==="signed_out"){ gateSignIn(); return; } gate("Couldn't reach the studio server: "+e.message); return; }
  const m = location.hash.match(/job=(\w+)/);
  renderShell();
  loadCast();
  if(m) openJob(m[1]);
}
function gate(msg){ $("#app").innerHTML = `<div class="gate"><div class="card"><h2>Shorts Studio</h2><p class="muted">${esc(msg)}</p><a class="btn" href="${esc(HQ_URL)}">Open NegoTrip HQ</a></div></div>`; }
function gateSignIn(){ $("#app").innerHTML = `<div class="gate"><div class="card"><h2>Sign in first</h2><p class="muted">Shorts Studio uses your NegoTrip HQ sign-in. Sign in there with your Google account, then open Shorts Studio from HQ (or come back to this page).</p><a class="btn" href="${esc(HQ_URL)}">Sign in at NegoTrip HQ</a></div></div>`; }
if(sb) sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT") gateSignIn(); });

// ---------------------------------------------------------------- shell (left column + workspace)
function renderShell(){
  const f = store.get("form", {duration:45, angle:"Discovery", language:"English"});
  $("#app").innerHTML = `
  <div class="layout">
    <aside>
      <form class="card" id="newForm">
        <h2>New video</h2>
        <div class="field"><label for="fDest">Destination</label><input type="text" id="fDest" required maxlength="80" placeholder="e.g. Puri, Odisha" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label for="fDur">Length</label><select id="fDur">${[30,45,60].map(d=>`<option value="${d}" ${+f.duration===d?"selected":""}>${d} seconds</option>`).join("")}</select></div>
          <div class="field"><label for="fLang">Language</label><select id="fLang">${LANGS.map(l=>`<option ${f.language===l?"selected":""}>${l}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label for="fAngle">Angle</label><select id="fAngle">${ANGLES.map(a=>`<option ${f.angle===a?"selected":""}>${a}</option>`).join("")}</select></div>
        <div class="field"><label for="fNotes">Anything to include? <span class="muted">(optional)</span></label><textarea id="fNotes" maxlength="500" placeholder="e.g. Mention our 3 nights / 4 days Puri–Konark package"></textarea></div>
        <button class="btn block" id="fGo">Write script & find footage</button>
        <p class="small muted" style="margin:8px 0 0">Takes 1–3 minutes. You can review and edit everything before making the video.</p>
      </form>
      <section class="card">
        <div class="btns" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">My videos</h2><button class="btn-sm" id="refreshJobs">Refresh</button></div>
        <div class="libbar"><input type="search" id="libQ" placeholder="Search name or place" aria-label="Search videos"><select id="libF" aria-label="Show"><option value="all">All</option><option value="mine">Made by me</option><option value="video">Video made</option><option value="archived">Archived</option></select></div>
        <ul class="jobs" id="jobList"></ul>
        <p class="small muted" style="margin:8px 0 0">Everything saves automatically to the team server. Open any video to carry on where you left off, from any computer.</p>
      </section>
      ${castCardHtml()}
    </aside>
    <section id="work"></section>
  </div>`;
  $("#newForm").addEventListener("submit", e=>{ e.preventDefault(); startJob(); });
  $("#refreshJobs").addEventListener("click", ()=>loadJobs().then(renderJobs).catch(e=>toast(e.message)));
  $("#libQ").addEventListener("input", renderJobs); $("#libF").addEventListener("change", renderJobs);
  renderJobs();
  bindCastCard();
  renderWork();
}
async function loadJobs(){ const r = await api("jobs"); S.jobs = (r && r.jobs) || []; }
function renderJobs(){
  const ul = $("#jobList"); if(!ul) return;
  const q=(($("#libQ")||{}).value||"").trim().toLowerCase(), f=(($("#libF")||{}).value||"all");
  let list=S.jobs.filter(j=> f==="archived" ? j.archived : !j.archived);
  if(f==="mine") list=list.filter(j=>!j.created_by || j.created_by===S.email || j.updated_by===S.email);
  if(f==="video") list=list.filter(j=>j.video_at);
  if(q) list=list.filter(j=>[j.name,j.title,j.destination,j.job_id].join(" ").toLowerCase().includes(q));
  if(!list.length){ ul.innerHTML = `<li class="small muted">${S.jobs.length?"Nothing matches.":"No videos yet."}</li>`; return; }
  ul.innerHTML = list.map(j=>{
    const when = j.saved_at ? "edited "+ago(j.saved_at)+(j.updated_by?" by "+who(j.updated_by):"") : (j.created_at ? "created "+ago(j.created_at) : "");
    const st = j.status==="running"||j.status==="processing" ? ["Working","warn"] : (j.status==="error"||j.status==="failed") ? ["Failed","bad"] : j.video_at ? ["Video made","ok"] : j.stage==="Footage approved" ? ["Ready to make","ok"] : j.stage ? ["Draft · "+j.stage,"warn"] : ["Script ready",""];
    return `<li class="jrow"><button data-job="${esc(j.job_id)}" aria-current="${S.jobId===String(j.job_id)}">${j.thumb?`<img class="jth" src="${esc(j.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span class="jth ph"></span>`}<span class="jtx"><span class="jt">${esc(j.name || j.title || j.destination)}</span><br><span class="jd">${esc(j.destination)} · ${esc(when)}</span><br><span class="pill ${st[1]}">${esc(st[0])}</span></span></button><button class="jarch" data-arch="${esc(j.job_id)}" title="${j.archived?"Restore":"Archive"}" aria-label="${j.archived?"Restore":"Archive"} ${esc(j.name||j.title||"")}">${j.archived?"↩":"🗄"}</button></li>`;
  }).join("");
  ul.querySelectorAll("button[data-job]").forEach(b=>b.addEventListener("click",()=>openJob(b.dataset.job)));
  ul.querySelectorAll("button[data-arch]").forEach(b=>b.addEventListener("click",()=>{ const j=S.jobs.find(x=>String(x.job_id)===b.dataset.arch); if(j) setArchived(j.job_id, !j.archived); }));
}

// ---------------------------------------------------------------- create + poll
async function startJob(){
  const dest = $("#fDest").value.trim(); if(!dest){ $("#fDest").focus(); return; }
  const body = { destination:dest, duration:+$("#fDur").value, language:$("#fLang").value, angle:$("#fAngle").value, notes:$("#fNotes").value.trim() };
  store.set("form", {duration:body.duration, angle:body.angle, language:body.language});
  const btn = $("#fGo"); btn.disabled = true; btn.textContent = "Starting…";
  try{
    const r = await api("create", body);
    if(!r.job_id) throw new Error("No job id returned");
    $("#fDest").value = ""; $("#fNotes").value = "";
    S.jobs.unshift({job_id:String(r.job_id), destination:dest, status:"running", title:"", created_at:new Date().toISOString()});
    renderJobs();
    openJob(String(r.job_id));
  }catch(e){ toast(e.message); }
  finally{ btn.disabled=false; btn.textContent="Write script & find footage"; }
}
async function openJob(id){
  if(S.job && SAVE.dirty && S.jobId!==String(id)) await saveNow();
  clearTimeout(S.pollTimer);
  S.jobId = String(id); S.job = null; S.result = null; S.checks = store.get("checks."+id, {}); S.openAlts = {};
  history.replaceState(null, "", "#job="+id);
  renderJobs();
  S.pollStart = Date.now();
  renderWork();
  poll();
}
async function poll(){
  const id = S.jobId;
  try{
    const r = await api("job", {job_id:id});
    if(id !== S.jobId) return;
    if(r.status === "done" && r.job){
      const job = await loadSavedJob(id, normalizeJob(r.job));
      if(id !== S.jobId) return;
      S.job = normalizeJob(job); renderWork();
      const j = S.jobs.find(x=>String(x.job_id)===id); if(j){ j.status="done"; j.title=r.job.title; renderJobs(); }
      getVideo(id).then(v=>{ if(v && v.blob && id===S.jobId){ S.lastResult={jobId:id, blob:v.blob, name:v.name}; showDlLast(); } });
      return;
    }
    if(r.status === "error"){ S.job=null; renderWork("error", r.error); return; }
    if(r.status === "not_found" && Date.now()-S.pollStart > 30000){ renderWork("missing"); return; }
    if(Date.now()-S.pollStart > 10*60*1000){ renderWork("slow"); return; }
  }catch(e){ if(id!==S.jobId) return; toast(e.message); }
  renderProgress();
  S.pollTimer = setTimeout(poll, 7000);
}

// ---------------------------------------------------------------- workspace
function renderWork(state, detail){
  const w = $("#work"); if(!w) return;
  if(!S.jobId){
    w.innerHTML = `<div class="card empty"><h2>Make a travel Short in three steps</h2><p class="muted" style="max-width:52ch;margin:0 auto">Type a destination on the left. The studio researches it, writes the script and finds footage you're allowed to use. You check it, then the video is made right here in your browser.</p>
    <div class="steps3"><div><b>1 · Script</b>AIDA script with an honest FOMO call to action, and a list of facts to double-check.</div><div><b>2 · Review</b>Edit any line, swap clips, or drop in your own footage for any scene.</div><div><b>3 · Make video</b>Voiceover, captions, titles, logo and music, saved as a vertical 9:16 video.</div></div></div>`;
    return;
  }
  if(state==="error"||state==="missing"||state==="slow"){
    const msg = state==="error" ? "This job failed: "+(detail||"unknown error") : state==="missing" ? "This job wasn't found." : "This is taking much longer than usual. Try again, or ask the owner to check the workflow in n8n.";
    w.innerHTML = `<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(msg)}</p></div>`; return;
  }
  if(!S.job){ w.innerHTML = `<div class="card"><div class="eyebrow">Job ${esc(S.jobId)}</div><h2 style="margin-top:4px">Working on it…</h2><p class="muted small" id="elapsed"></p><ul class="progress" id="prog"></ul></div>`; renderProgress(); return; }
  renderJob();
}
function renderProgress(){
  const p = $("#prog"); if(!p) return;
  const s = (Date.now()-S.pollStart)/1000;
  const steps = [["Researching the destination",0],["Writing the script",25],["Searching licensed footage",70],["Checking every clip matches the place",95]];
  p.innerHTML = steps.map(([t,at],i)=>{ const next = steps[i+1]?steps[i+1][1]:1e9; const cls = s>=next?"done":s>=at?"now":""; return `<li class="${cls}"><i></i>${t}</li>`; }).join("");
  const el = $("#elapsed"); if(el) el.textContent = `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")} elapsed · usually 1–3 minutes. You can leave this page and come back.`;
}

// ---------------------------------------------------------------- job view: scenes, footage review, approvals
const MATCH = { exact:["Exact place","ok"], verified:["Approved before","ok"], generic:["Generic scenery","ok"], representative:["Representative","warn"], none:["No footage","bad"] };
const SRC_SHORT = { "Pexels":"Pexels", "Pixabay":"Pixabay", "Wikimedia Commons":"Wikimedia", "Your library":"Our library" };

// Old jobs (before multi-source) only had footage + alternates; give them the new shape.
function normalizeJob(job){
  (job.scenes||[]).forEach(sc=>{
    if(!Array.isArray(sc.candidates)){
      sc.candidates = [sc.footage, ...(sc.alternates||[])].filter(Boolean).map(c=>Object.assign({cid:"pexels-v:"+c.pexels_id, source:"Pexels", kind:"video", preview_url:c.download_url_sd||c.download_url, ai_ok:true}, c));
      sc.footage = sc.candidates[0] || null;
    }
    sc.candidates.forEach(c=>{ if(!c.kind) c.kind="video"; if(!c.source) c.source="Pexels"; });
    if(sc.approved==null) sc.approved = !!(sc.footage && sc.footage.verified);
  });
  return job;
}
function placeOf(sc){ return (sc.location||"").trim() || (S.job.request&&S.job.request.destination) || "scene"; }
function sceneReady(sc){ return sc.card || (sc.footage && sc.approved); }
function readyCount(){ return S.job.scenes.filter(sceneReady).length; }

function thumbHtml(c, cls){
  if(!c) return `<div class="${cls} ph">Title card</div>`;
  if(c.local_url && c.kind==="photo") return `<img class="${cls}" src="${esc(c.local_url)}" alt="">`;
  if(c.local_thumb) return `<img class="${cls}" src="${esc(c.local_thumb)}" alt="">`;
  if(c.thumbnail) return `<img class="${cls}" src="${esc(c.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
  return `<div class="${cls} ph">${c.kind==="photo"?"Photo":"Video"}<br>${esc(SRC_SHORT[c.source]||c.source||"")}</div>`;
}
function licHtml(c){
  if(!c) return "";
  const bits=[esc(SRC_SHORT[c.source]||c.source)];
  if(c.licence) bits.push(esc(c.licence));
  if(c.credit) bits.push("by "+esc(c.credit));
  return bits.join(" · ");
}

function renderJob(){
  const j = S.job, w = $("#work");
  const checks = [...(j.fact_check_notes||[]).map(t=>["fact",t]), ...(j.warnings||[]).map(t=>["warn",t])];
  const done = checks.filter((c,i)=>S.checks[i]).length;
  const total = j.scenes.reduce((a,s)=>a+(+s.duration_sec||0),0);
  w.innerHTML = `
  <div class="card">
    <div class="jobhead">
      <div style="min-width:0;flex:1 1 100%"><div class="eyebrow">${esc(j.request?.destination)} · ${esc(j.request?.angle)} · ${esc(j.request?.language)} · job ${esc(j.job_id)}</div>
        <input class="namein" id="jobName" maxlength="120" value="${esc(j._name||"")}" placeholder="${esc(j.title||"Name this video")}" aria-label="Video name">
        <div class="muted small">${esc(j._name?j.title:"")}${j._name?" · ":""}Planned length about ${total}s · ${j.scenes.length} scenes</div></div>
      <div class="btns"><span class="pill" id="saveState"></span><button class="btn-sm" id="saveBtn">💾 Save</button><span class="pill num" id="readyPill"></span><a class="btn" href="#make" id="toMake">Make the video ↓</a></div>
    </div>
    <div class="notice small" id="conflictBox" hidden></div>
    <div class="director"><div class="small muted" style="margin:12px 0 6px"><b style="color:var(--accent)">✦ AI director</b> · tell the AI what you want changed anywhere in the video: script, scenes, order, footage, framing, looks, titles, captions, voice, language, music, caption for posting. It proposes the exact changes; you apply them.</div><div class="aihost" data-key="director"></div></div>
  </div>

  <div class="card">
    <h2>Check before posting <span class="pill ${done===checks.length?"ok":"warn"} num" id="checkPill" style="vertical-align:middle">${done}/${checks.length}</span></h2>
    <ul class="checks">${checks.map(([k,t],i)=>`<li><label><input type="checkbox" data-check="${i}" ${S.checks[i]?"checked":""}><span>${k==="warn"?"<b>Warning:</b> ":""}${esc(t)}</span></label></li>`).join("")}</ul>
  </div>

  <div class="card">
    <h2>Scenes & footage</h2>
    <p class="small muted" style="margin:-4px 0 12px">Every scene needs footage that a person has <b>approved</b> before the video can be made, whatever its source. Tap a clip to preview it, then <b>Approve</b> or <b>Reject</b>. Approvals and rejections are remembered for that place, so next time the right footage comes first. Your own uploads go into the team library.</p>
    <div class="aihost" data-key="script"></div>
    <div class="scenes" id="sceneList"></div>
  </div>

  <div class="card">
    <h2>Caption for posting</h2>
    <textarea id="caption" style="min-height:110px">${esc(captionText())}</textarea>
    <div class="field" style="margin-top:10px"><label class="small muted" for="credits">Footage and music credits (added when you copy the caption)</label><textarea id="credits" readonly style="min-height:56px;font-size:13px"></textarea></div>
    <div class="btns" style="margin-top:8px"><button class="btn-sm" id="copyCap">Copy caption + credits</button><button class="btn-sm" id="dlJob">Download job file (for the PC renderer)</button></div>
    <div class="aihost" data-key="caption"></div>
  </div>

  <div class="card" id="make">
    <h2>Make the video</h2>
    <div class="notice" id="gateNote" hidden></div>
    <div class="render">
      <div>
        <div class="row2">
          <div class="field"><label for="vOpen">Voice & language</label><input type="hidden" id="rVoice" value="${esc(VC().voice||"Kore")}"><div class="vsum" id="voiceSummary">${voiceSummary()}</div></div>
          <div class="field"><label for="rQual">Quality</label><select id="rQual"><option value="1080" ${store.get("quality","1080")==="1080"?"selected":""}>1080 × 1920 (best)</option><option value="720" ${store.get("quality","1080")==="720"?"selected":""}>720 × 1280 (faster)</option></select></div>

      ${sceneAvatarLine(sc)}

function updateGate(){
  const n=S.job.scenes.length, r=readyCount();
  const p=$("#readyPill"); if(p){ p.textContent=`${r}/${n} scenes approved`; p.className="pill num "+(r===n?"ok":"warn"); }

  if(pb) pb.disabled = r!==n || S.busy;
}

async function approve(i, c){
  const sc=S.job.scenes[i]; if(!c) return;
  sc.footage=c; sc.approved=true; sc.card=false; c.verified=true;
  if(!sc.candidates.find(x=>x.cid===c.cid)) sc.candidates.unshift(c);
  invalidate(); saveLocal(); renderScenes(); updateCredits();
  if(c.source!=="Your library" && c.source!=="AI avatar") api("verdict",{verdict:"approved", item:c, place:placeOf(sc), destination:S.job.request?.destination||""}).catch(e=>toast("Saved here, but couldn't save the approval for next time: "+e.message));
}
async function reject(i, c, note){
  const sc=S.job.scenes[i]; if(!c) return;
  c._rejected=true; (sc.candidates||[]).forEach(x=>{ if(x.cid===c.cid) x._rejected=true; });
  if(sc.footage && sc.footage.cid===c.cid){
    sc.approved=false;
    sc.footage = sc.candidates.find(x=>!x._rejected && x.ai_ok!==false) || sc.candidates.find(x=>!x._rejected) || null;
    if(sc.footage && sc.footage.verified) sc.approved=true;
  }
  invalidate(); saveLocal(); renderScenes(); updateCredits();
  if(c.source==="AI avatar"){ toast("Shot removed."); return; }
  api("verdict",{verdict:"rejected", item:c, place:placeOf(sc), destination:S.job.request?.destination||"", note:note||""}).catch(e=>toast("Couldn't save the rejection: "+e.message));
  toast("Rejected. It won't be suggested for "+placeOf(sc)+" again.");
}
async function searchMore(i, q, btn){
  q=String(q||"").trim(); if(!q) return;
  const sc=S.job.scenes[i]; sc._q=q;
  btn.disabled=true; btn.textContent="Searching…";
  try{
    const r = await api("search",{query:q, place:placeOf(sc), destination:S.job.request?.destination||"", limit:30});
    const have=new Set(sc.candidates.map(x=>x.cid)); let added=0;
    for(const c of (r.candidates||[])){ if(!have.has(c.cid)){ c.ai_ok=false; sc.candidates.push(c); added++; } }
    saveLocal(); renderScenes();
    toast(added ? `${added} more choices added` : "No new footage found. Try different words.");
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent="Search"; }
}

function closeModal(){ if(typeof stopMusicPreview==="function") stopMusicPreview(); const m=$("#modal"); if(m){ m.querySelectorAll("video").forEach(v=>v.pause()); m.hidden=true; m.innerHTML=""; } }

// ---------------------------------------------------------------- upload own footage (trim + compress in the browser, then save to the team library)
function openUpload(i, file){
  const sc=S.job.scenes[i];
  const isVideo=file.type.startsWith("video/"), isImg=file.type.startsWith("image/");
  if(!isVideo && !isImg){ toast("Choose a video or photo file."); return; }
  const url=URL.createObjectURL(file);
  const m=modal(`<div class="mhead"><b>Add to our library · Scene ${i+1}</b><button class="btn-sm" data-close>Cancel</button></div>
    <div class="mstage">${isVideo?`<video id="upv" src="${url}" controls muted playsinline></video>`:`<img src="${url}" alt="">`}</div>
    <div class="field" style="margin-top:10px"><label for="upPlace">Place shown</label><input type="text" id="upPlace" value="${esc(placeOf(sc))}" maxlength="120"><div class="hint">Name the exact place so it's found automatically next time.</div></div>
    ${isVideo?`<div class="row2"><div class="field"><label for="upStart">Start at (seconds)</label><input type="number" id="upStart" value="0" min="0" step="0.5"></div><div class="field"><label for="upLen">Length (max 15 s)</label><input type="number" id="upLen" value="${Math.min(10,Math.max(3,+sc.duration_sec||6))}" min="2" max="15" step="0.5"></div></div><div class="hint" style="margin:-6px 0 10px">Play the clip and use the current time as the start if you like. <button class="btn-sm" id="useNow" style="height:26px">Use current time</button></div>`:""}
    <div class="field"><label for="upNote">Note <span class="muted">(optional)</span></label><input type="text" id="upNote" maxlength="200" placeholder="e.g. Sunrise, our Dec 2025 group trip"></div>
    <label class="small" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px"><input type="checkbox" id="upRights" style="margin-top:3px"> I confirm NegoTrip owns this footage or has permission to use it in ads, and anyone recognisable has agreed to appear.</label>
    <div class="btns"><button class="btn" id="upGo" disabled>Save to library & use</button><span class="log" id="upLog"></span></div>`);
  m.querySelector("[data-close]").onclick=()=>{ URL.revokeObjectURL(url); closeModal(); };
  const rights=m.querySelector("#upRights"), go=m.querySelector("#upGo");
  rights.onchange=()=>go.disabled=!rights.checked;
  const un=m.querySelector("#useNow"); if(un) un.onclick=()=>{ m.querySelector("#upStart").value=(m.querySelector("#upv").currentTime||0).toFixed(1); };
  go.onclick=async()=>{
    go.disabled=true; const log=m.querySelector("#upLog");
    try{
      const place=m.querySelector("#upPlace").value.trim()||placeOf(sc), note=m.querySelector("#upNote").value.trim();
      let blob, meta={};
      if(isVideo){
        const start=Math.max(0,+m.querySelector("#upStart").value||0), len=Math.min(15,Math.max(2,+m.querySelector("#upLen").value||6));
        log.textContent="Preparing clip (plays once in the background)…";
        const r=await compressVideo(url,start,len,p=>log.textContent=`Preparing clip ${Math.round(p*100)}%`);
        blob=r.blob; meta={duration:len,width:720,height:1280,thumb:r.thumb};
      }else{
        log.textContent="Preparing photo…";
        const r=await compressImage(file); blob=r.blob; meta={width:r.w,height:r.h};
      }
      if(blob.size>10.5*1024*1024) throw new Error("File is still too large after compressing. Use a shorter part.");
      log.textContent="Uploading…";
      const data=await blobToBase64(blob);
      const res=await api("upload",{place, note, destination:S.job.request?.destination||"", mime:blob.type.split(";")[0], data, duration:meta.duration||null, width:meta.width, height:meta.height});
      const item=Object.assign({}, res.item, {local_url:URL.createObjectURL(blob), local_thumb:meta.thumb||null, verified:true, ai_ok:true});
      closeModal(); URL.revokeObjectURL(url);
      S.media.set("own:"+item.drive_id, item.local_url);
      approve(i,item);
      toast("Saved to the team library and approved.");
    }catch(e){ log.textContent=""; toast(e.message); go.disabled=false; }
  };
}
function blobToBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(new Error("Couldn't read file")); r.readAsDataURL(blob); }); }
async function compressImage(file){
  const img=await loadImage(file); const max=1600; const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.86)); return {blob,w:c.width,h:c.height};
}
async function compressVideo(url,start,len,onProgress){
  const v=await loadVideo(url); v.loop=false; v.muted=true;
  await seek(v,Math.min(start,Math.max(0,(v.duration||start)-0.5)));
  const W=720,H=1280,c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const mime=["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"video/webm";
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:4_000_000}); const chunks=[];
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const draw=()=>{ const s=Math.max(W/v.videoWidth,H/v.videoHeight), dw=v.videoWidth*s, dh=v.videoHeight*s; g.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh); };
  draw(); const thumb=c.toDataURL("image/jpeg",0.7);
  rec.start(250); await v.play();
  const t0=v.currentTime;
  await new Promise(res=>{ (function tick(){ draw(); const p=(v.currentTime-t0)/len; onProgress(Math.min(1,p)); if(p>=1||v.ended) return res(); requestAnimationFrame(tick); })(); });
  v.pause(); await new Promise(r=>{ rec.onstop=r; rec.stop(); });
  return {blob:new Blob(chunks,{type:mime.split(";")[0]}), thumb};
}

// ---------------------------------------------------------------- caption + credits
function captionText(){ const j=S.job; if(j._caption!=null) return j._caption; const tags=(j.hashtags||[]).map(h=>String(h).startsWith("#")?h:"#"+h).join(" "); return `${j.caption||""}\n\n${tags}`.trim(); }
function creditsText(){
  const lines=[]; const seen=new Set();
  for(const sc of S.job.scenes){ const c=sc.card?null:sc.footage; if(!c||!sc.approved||seen.has(c.cid)) continue; seen.add(c.cid);
    if(c.source==="Your library") continue;
    if(c.attribution_required || c.source==="Wikimedia Commons") lines.push(`${c.credit||"Unknown"} / Wikimedia Commons, ${c.licence}${c.licence_url?" ("+c.licence_url+")":""}`);
    else if(c.credit) lines.push(`${c.credit} / ${c.source}`);
  }
  const out=[]; if(lines.length) out.push("Footage: "+lines.join("; "));
  const mc=(typeof musicCredit==="function")?musicCredit():""; if(mc) out.push(mc);
  if(typeof hasAiPeople==="function" && hasAiPeople()) out.push("Contains AI-generated people (made with Google Gemini).");
  return out.join("\n");
}
function updateCredits(){ const el=$("#credits"); if(el) el.value=creditsText(); }
function bindJob(){
  const w = $("#work");
  w.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>{ S.checks[c.dataset.check]=c.checked; store.set("checks."+S.jobId,S.checks); const n=w.querySelectorAll("[data-check]").length, d=Object.values(S.checks).filter(Boolean).length; const p=$("#checkPill"); if(p){ p.textContent=`${d}/${n}`; p.className="pill num "+(d>=n?"ok":"warn"); } }));
  $("#caption").addEventListener("input",e=>{ S.job._caption=e.target.value; saveLocal(); });

  $("#dlJob").addEventListener("click",()=>{ const clean=JSON.parse(JSON.stringify(S.job,(k,v)=>(k==="local_url"||k==="local_thumb")?undefined:v)); saveBlob(new Blob([JSON.stringify(clean,null,2)],{type:"application/json"}), "job.json"); });
  $("#toMake").addEventListener("click",e=>{ e.preventDefault(); $("#make").scrollIntoView({behavior:"smooth"}); });
  updateCredits();

function saveBlob(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); }

// ================================================================ RENDERER
// Everything below runs in the browser: voice from Gemini (via n8n), clips via the n8n proxy,
// drawn on a canvas and recorded with MediaRecorder.
const R = { prepared:null, ctx:null, playing:false, stopFn:null, logo:null, music:null };

function loadImage(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); }); }
function audioCtx(){ if(!R.ctx || R.ctx.state==="closed") R.ctx=new (window.AudioContext||window.webkitAudioContext)(); return R.ctx; }

async function getVoice(text, sc, voiceOverride){
  const voice = voiceOverride || (typeof sceneVoice==="function" && sceneVoice(sc)) || VC().voice || "Kore", style = voiceStyle(sc);
  const key = voice+"|"+style+"|"+text;
  if(S.voices.has(key)) return S.voices.get(key);
  const r = await api("voice", {text, voice, style});
  if(r.error) throw new Error(r.error);
  if(!r.data) throw new Error("No audio came back. Try again.");
  const bin = Uint8Array.from(atob(r.data), c=>c.charCodeAt(0));
  let bytes = bin.buffer;
  if(!/wav/i.test(r.mime||"")) bytes = pcmToWav(bin, 24000); // raw PCM fallback
  const buf = await audioCtx().decodeAudioData(bytes.slice(0));
  S.voices.set(key, buf);
  return buf;
}
function pcmToWav(pcm, rate){
  const h=new ArrayBuffer(44), v=new DataView(h), w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4,36+pcm.length,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,pcm.length,true);
  const out=new Uint8Array(44+pcm.length); out.set(new Uint8Array(h),0); out.set(pcm,44); return out.buffer;
}
async function hearVoice(){
  const b=$("#hearVoice"); b.disabled=true; b.textContent="Loading…";
  try{
    const text = (S.job.scenes[0] && S.job.scenes[0].narration) || "Welcome to NegoTrip.";
    const buf = await getVoice(text, S.job.scenes[0]);
    const ctx=audioCtx(); await Promise.race([ctx.resume(), sleep(1500)]); const s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.start();
  }catch(e){ toast(e.message); }
  b.disabled=false; b.textContent="▶ Hear this voice";
}
async function getClipUrl(sc, quality){
  if(sc.card || !sc.footage) return null;
  const c = sc.footage;
  if(c.local_url) return c.local_url;
  if(c.drive_id){
    const key="own:"+c.drive_id;
    if(S.media.has(key)) return S.media.get(key);
    const obj=URL.createObjectURL(await api("media",{drive_id:c.drive_id},true)); S.media.set(key,obj); c.local_url=obj; return obj;
  }
  const url = (quality==="720" && c.download_url_sd) || c.download_url;
  if(!url) return null;
  if(S.media.has(url)) return S.media.get(url);
  const obj = URL.createObjectURL(await api("media", {url}, true));
  S.media.set(url, obj);
  return obj;
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("photo could not be opened")); im.src=src; }); }
function loadVideo(src){
  return new Promise((res,rej)=>{
    const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload="auto"; v.loop=true; v.crossOrigin="anonymous";
    const to=setTimeout(()=>rej(new Error("clip took too long to load")), 60000);
    v.addEventListener("loadeddata",()=>{ clearTimeout(to); res(v); },{once:true});
    v.addEventListener("error",()=>{ clearTimeout(to); rej(new Error("clip could not be played")); },{once:true});
    v.src=src; v.load();
  });
}
function waitVisible(){ if(document.visibilityState==='visible') return Promise.resolve(); setLog('Waiting for this tab to be visible…'); return new Promise(res=>{ const f=()=>{ if(document.visibilityState==='visible'){ document.removeEventListener('visibilitychange',f); res(); } }; document.addEventListener('visibilitychange',f); }); }
function seek(v,t){ return new Promise(res=>{ if(Math.abs(v.currentTime-t)<0.05) return res(); const done=()=>res(); v.addEventListener("seeked",done,{once:true}); v.currentTime=t; setTimeout(done,3000); }); }
function speechBounds(buf){
  const d=buf.getChannelData(0), sr=buf.sampleRate, win=Math.floor(sr*0.01); let first=-1,last=-1;
  for(let i=0;i<d.length;i+=win){ let m=0; for(let k=i;k<Math.min(i+win,d.length);k++){ const a=Math.abs(d[k]); if(a>m)m=a; } if(m>0.02){ if(first<0) first=i; last=i+win; } }
  if(first<0) return {start:0,end:buf.duration};
  return {start:first/sr, end:Math.min(buf.duration,last/sr)};
}
function wordTimes(text, start, end){
  const words = String(text).split(/\s+/).filter(Boolean).flatMap(w=> /[\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Thai}]/u.test(w) && w.length>6 ? (w.match(/.{1,5}/gu)||[w]) : [w]);
  const wts = words.map(w=>w.replace(/[^\p{L}\p{N}]/gu,"").length + 2 + (/[,.;:!?—]$/.test(w)?3:0));
  const tot = wts.reduce((a,b)=>a+b,0) || 1; let acc=0;
  return words.map((w,i)=>{ const s=start+(acc/tot)*(end-start); acc+=wts[i]; return {text:w.replace(/["“”]/g,""), start:s, end:start+(acc/tot)*(end-start)}; });
}

const ASSETS = new Map();   // scene id -> {voice, bounds, video, image, defOffset, myVoice}
function ed(sc){
  const d = {start:null, speed:1, zoom:1, panX:0, panY:0, motion:"auto", bright:1, contrast:1, sat:1, warmth:0, transition:"dip", titlePos:"top", titleSize:1, hideTitle:false, voiceVol:1, delivery:"", titleColor:"", titleBg:"", titleFont:"", sceneTint:"", sceneTintOpacity:0.25};
  if(!sc.edit) sc.edit={};
  for(const k in d) if(!(k in sc.edit)) sc.edit[k]=d[k];
  return sc.edit;
}
function st(){
  const d = Object.assign({}, STYLE_DEFAULTS, {musicVol:0.3, voiceVol:1, fadeIn:true, fadeOut:true, musicStart:0});
  if(!S.job.style){ S.job.style={}; const b=store.get("brandStyle",null); if(b) BRAND_KEYS.forEach(k=>{ if(k in b) S.job.style[k]=b[k]; }); }

async function prepare(){
  if(S.busy) return;
  if(readyCount()!==S.job.scenes.length){ toast("Approve footage for every scene first."); updateGate(); return; }
  S.busy=true;
  const btn=$("#prepBtn"); btn.disabled=true; $("#playBtn").disabled=true; $("#recBtn").disabled=true; $("#resultBox").innerHTML="";
  const job=S.job, voice=$("#rVoice").value, quality=$("#rQual").value, n=job.scenes.length;
  try{
    await document.fonts.load('800 80px "Bricolage Grotesque"').catch(()=>{});
    await loadStyleFonts();
    const ctx=audioCtx(); ctx.resume().catch(()=>{});
    let steps=0; const totalSteps=n*2+1;
    const tick=(msg)=>{ steps++; setBar(steps/totalSteps); setLog(msg); };
    // voices, two at a time (own recordings are kept)
    let next=0, got=0;
    async function worker(){ while(next<n){ const i=next++; const sc=job.scenes[i]; const a=ASSETS.get(sc.id)||{};
      if(a.myVoice && a.voiceText!==sc.narration) a.myVoice=false;
      if(!a.myVoice){ const txt=(sc.narration||"").trim(); a.voice = txt ? await getVoice(txt, sc) : null; a.bounds = a.voice ? speechBounds(a.voice) : null; }
      ASSETS.set(sc.id,a); got++; tick(`Voiceover ${got}/${n}`); } }
    await Promise.all([worker(),worker()]);
    // footage, three at a time
    const urls=new Array(n); let nextClip=0, gotClips=0;
    async function clipWorker(){ while(nextClip<n){ const i=nextClip++;
      try{ urls[i]=await getClipUrl(job.scenes[i], quality); }catch(e){ urls[i]=null; toast(`Scene ${i+1}: ${e.message}. Using a title card.`); }
      gotClips++; tick(`Footage ${gotClips}/${n} downloaded`); } }
    await Promise.all([clipWorker(),clipWorker(),clipWorker()]);
    await waitVisible();
    for(let i=0;i<n;i++){
      const sc=job.scenes[i], a=ASSETS.get(sc.id)||{};
      a.video=null; a.image=null;
      if(urls[i]) try{ if(sc.footage && sc.footage.kind==="photo") a.image=await loadImg(urls[i]); else a.video=await loadVideo(urls[i]); }catch(e){ toast(`Scene ${i+1}: ${e.message}. Using a title card.`); }
      ASSETS.set(sc.id,a);
      setLog(`Opening footage ${i+1}/${n}`);
    }
    let musicBuf=null;
    if(R.music){ try{ musicBuf=await ctx.decodeAudioData(await R.music.arrayBuffer()); }catch(e){ toast("Couldn't read the music file."); } }
    tick("Ready");
    const [W,H] = quality==="720" ? [720,1280] : [1080,1920];
    const cv=$("#cv"); cv.width=W; cv.height=H;
    R.prepared={scenes:[],total:0,W,H,musicBuf,cta:job.cta||{},website:(job.branding&&job.branding.website)||"negotrip.com",keyword:(job.request&&job.request.cta_keyword)||""};
    relayout();
    R.scrub=0.2; await scrubTo(0.2);
    setLog(`Ready · ${R.prepared.total.toFixed(1)} seconds. Edit below, play the preview, then record.`);
    $("#playBtn").disabled=false; $("#recBtn").disabled=false;
    renderEditor();
  }catch(e){
    setLog("Couldn't prepare: "+e.message); toast(e.message);
  }finally{ btn.disabled=false; S.busy=false; }
}

// Rebuild the timeline from loaded assets + current edits (fast; no downloads)
function relayout(){
  const P=R.prepared; if(!P) return;
  let t=0;
  P.scenes = S.job.scenes.map((sc)=>{
    const a=ASSETS.get(sc.id)||{}, e=ed(sc);
    const vb=a.voice||null, b=a.bounds||{start:0,end:0};
    const lead=0.12;
    const s={sc, e, video:a.video||null, image:a.image||null, voice:vb};
    s.t0=t; s.aStart=t+lead;
    s.dur=Math.max(+sc.duration_sec||3, vb ? lead+b.end+0.35 : 2.5);
    s.t1=t+s.dur; t+=s.dur;
    s.words = vb ? wordTimes(sc.narration, s.aStart+b.start, s.aStart+b.end) : [];
    s.speechEnd = s.aStart + b.end;
    s.representative = !sc.card && (s.video||s.image) && sc.match==="representative" && sc.footage && sc.footage.source!=="Your library";
    if(s.video){ const len=s.video.duration||0; const def = len > s.dur*e.speed+1.5 ? Math.min(1, len-s.dur*e.speed) : 0; s.offset = e.start!=null ? Math.max(0,Math.min(e.start, Math.max(0,len-0.2))) : def; s.clipLen=len; }
    else s.offset=0;
    return s;
  });
  P.total=t;
  const sl=$("#scrub"); if(sl){ sl.max=t.toFixed(2); }
}
function clipTimeAt(s,t){ const len=s.clipLen||s.video.duration||1; let ct=s.offset+(t-s.t0)*s.e.speed; if(ct>=len-0.05) ct = len>0.2 ? (ct % (len-0.05)) : 0; return ct; }
async function scrubTo(t){
  const P=R.prepared; if(!P) return;
  t=Math.max(0,Math.min(P.total-0.01,t)); R.scrub=t;
  const s=P.scenes.find(x=>t>=x.t0&&t<x.t1)||P.scenes[P.scenes.length-1];
  if(s && s.video){ await seek(s.video, clipTimeAt(s,t)); }
  const prev=P.scenes[P.scenes.indexOf(s)-1];
  if(prev && prev.video && s.e.transition==="fade" && t-s.t0<0.5){ await seek(prev.video, clipTimeAt(prev, prev.t1-0.01)); }
  drawFrame(t);
  const lab=$("#scrubLab"); if(lab) lab.textContent=`${t.toFixed(1)}s / ${P.total.toFixed(1)}s · scene ${P.scenes.indexOf(s)+1}`;
  const sl=$("#scrub"); if(sl && document.activeElement!==sl) sl.value=t;
}

function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// Draw one scene's picture (footage with its reframe, motion and colour edits)

}

// ---------------------------------------------------------------- playback / recording
function stopPlayback(){ if(R.stopFn) R.stopFn(true); }
async function play(record, from, until){
  const P=R.prepared; if(!P || R.playing) return;
  const ctx=audioCtx(); await Promise.race([ctx.resume(), sleep(1500)]);
  if(ctx.state!=="running"){ toast("Click the button again to allow sound."); return; }
  const G=st();
  const start = record ? 0 : Math.max(0, from!=null ? from : (R.scrub && R.scrub < P.total-0.5 ? R.scrub : 0));
  const end = record ? P.total : (until!=null ? until : P.total);
  R.playing=true;
  const playBtn=$("#playBtn"), recBtn=$("#recBtn"), prepBtn=$("#prepBtn");
  playBtn.textContent = "■ Stop"; recBtn.disabled=true; prepBtn.disabled=true; if(record) playBtn.disabled=false;
  // line every clip up at its in-point before starting
  for(const s of P.scenes){ if(s.video){ s.video.pause(); s.video.playbackRate=s.e.speed; await seek(s.video, clipTimeAt(s, Math.max(s.t0, Math.min(start, s.t1-0.01)))); } }
  const master=ctx.createGain(); master.gain.value=1;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; master.connect(comp);
  comp.connect(ctx.destination);
  let dest=null, rec=null, chunks=[], mime="";
  const T0=ctx.currentTime+0.35 - start;   // T0 = when timeline time 0 would have been
  const now=ctx.currentTime+0.35;
  const sources=[];
  for(const s of P.scenes){ if(!s.voice) continue; const off=start-s.aStart; if(off>=s.voice.duration) continue;
    const src=ctx.createBufferSource(); src.buffer=s.voice; const gn=ctx.createGain(); gn.gain.value=s.e.voiceVol*G.voiceVol; src.connect(gn); gn.connect(master);
    if(off>0) src.start(now, off); else src.start(T0+s.aStart); sources.push(src); }
  if(P.musicBuf && G.musicVol>0){
    const m=ctx.createBufferSource(); m.buffer=P.musicBuf; m.loop=true; const mg=ctx.createGain(); m.connect(mg); mg.connect(master);
    const hi=G.musicVol, lo=G.musicVol*0.3;
    mg.gain.setValueAtTime(G.fadeIn&&start<0.1?0:hi,now); if(G.fadeIn&&start<0.1) mg.gain.linearRampToValueAtTime(hi,now+1.2);
    for(const s of P.scenes){ if(!s.voice||s.speechEnd<start) continue; mg.gain.setTargetAtTime(lo,Math.max(now,T0+s.aStart-0.1),0.08); mg.gain.setTargetAtTime(hi,Math.max(now,T0+s.speechEnd+0.15),0.25); }
    if(G.fadeOut) mg.gain.setTargetAtTime(0,T0+P.total-1.4,0.4);
    m.start(now, ((+G.musicStart||0) + start) % P.musicBuf.duration); m.stop(T0+end+0.3); sources.push(m);
  }
  if(record){
    dest=ctx.createMediaStreamDestination(); comp.connect(dest);
    const cv=$("#cv"); const vs=cv.captureStream(30);
    const stream=new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    mime=["video/mp4;codecs=avc1.640028,mp4a.40.2","video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m))||"";

    rec=new MediaRecorder(stream,{mimeType:mime||undefined, videoBitsPerSecond:P.W>=1080?10_000_000:6_000_000, audioBitsPerSecond:192_000});
    rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    rec.start(500);
    setLog("Recording… keep this tab visible.");
  }
  let cur=-1, aborted=false, raf=0, prevStop=null;
  const onHide=()=>{ if(record && document.visibilityState==="hidden"){ aborted=true; finish(true); toast("Recording stopped because the tab was hidden. Record again and keep this tab visible."); } };
  document.addEventListener("visibilitychange",onHide);

    P.scenes.forEach(s=>{ if(s.video){ s.video.pause(); } });
    try{ master.disconnect(); comp.disconnect(); }catch(e){}
    playBtn.textContent="▶ Play preview"; recBtn.disabled=false; prepBtn.disabled=false;
    if(rec){

  }

    const t=ctx.currentTime-T0;
    if(t>=end+(record?0.25:0)){ finish(false); return; }
    const idx=P.scenes.findIndex(s=>t>=s.t0&&t<s.t1);
    if(idx!==cur && idx>=0){
      const prev=P.scenes[cur], s=P.scenes[idx];

    if(prevStop && t>=prevStop.at){ prevStop.v.pause(); prevStop=null; }
    drawFrame(Math.max(start,t)); setBar(Math.max(0,t)/P.total);
    if(!record){ R.scrub=t; const sl=$("#scrub"); if(sl) sl.value=t; }
    raf=requestAnimationFrame(loop);
  }

}

const _scripts={};
function loadScript(src){ return _scripts[src] || (_scripts[src]=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>{ delete _scripts[src]; rej(new Error("could not load "+src)); }; document.head.appendChild(sc); })); }
async function toPhoneMp4(blob, W, H, onProg){
  await loadScript("vendor/mediabunny.min.js"); const M=window.Mediabunny;
  try{ if(!(await M.canEncodeAudio("aac"))){ await loadScript("vendor/mediabunny-aac-encoder.min.js"); window.MediabunnyAacEncoder.registerAacEncoder(); } }catch(e){ console.warn("AAC encoder", e); }
  const vbit = W>=1080 ? 5_000_000 : 3_000_000;
  let canAvc=false; try{ canAvc = await M.canEncodeVideo("avc",{width:W,height:H,bitrate:vbit}); }catch(e){}
  const attempt=async(video)=>{
    const input=new M.Input({source:new M.BlobSource(blob), formats:M.ALL_FORMATS});
    const output=new M.Output({format:new M.Mp4OutputFormat({fastStart:"in-memory"}), target:new M.BufferTarget()});
    const conv=await M.Conversion.init({input, output, video, audio:(t)=> t.codec==="aac" ? {codec:"aac"} : {codec:"aac", bitrate:160000}, showWarnings:false});
    const isV=t=>typeof t.isVideoTrack==="function"?t.isVideoTrack():t.type==="video";
    const hadAudio=!!(await input.getPrimaryAudioTrack().catch(()=>null));
    if(!conv.isValid || !conv.utilizedTracks.some(isV) || (hadAudio && !conv.utilizedTracks.some(t=>!isV(t)))){ console.warn("conversion not usable", conv.discardedTracks); return null; }
    conv.onProgress=p=>{ try{ onProg&&onProg(p); }catch(e){} };
    await conv.execute();
    if(!output.target.buffer || output.target.buffer.byteLength<20000) return null;
    return new Blob([output.target.buffer],{type:"video/mp4"});
  };
  let out=null;
  if(canAvc) out=await attempt({codec:"avc", bitrate:vbit, frameRate:30, keyFrameInterval:2, forceTranscode:true}).catch(e=>{ console.warn(e); return null; });
  if(!out) out=await attempt({codec:"avc"}).catch(e=>{ console.warn(e); return null; });
  return out;
}
async function finishRecording(blob, mime){

  setLog("Converting for phones…");
  let phone=null;
  try{ phone=await toPhoneMp4(blob, P.W, P.H, p=>{ const pc=Math.round(p*100); const a=$("#convPct"), b=$("#convBar"); if(a) a.textContent=pc+"%"; if(b) b.style.width=pc+"%"; }); }catch(e){ console.warn(e); }

    ${convFailed?`<div class="notice small" style="margin:0 0 8px"><b>Couldn't convert this to a phone-friendly MP4 in this browser.</b> The file below may not open on phones or WhatsApp. Update Chrome or Edge to the latest version on a Windows or Mac computer and record again.</div>`:""}

    <p class="small muted">Tick off the checks above before you post.</p></div>`;

// ================================================================ SAVING (team server) + MY VIDEOS
// Every change is saved automatically to the team server (n8n data tables), so work is never lost and
// can be reopened from any computer. A small backup is also kept in this browser until the server has it.
const SAVE = { timer:null, dirty:false, saving:false, version:0, savedAt:"", savedBy:"", error:"", conflict:null, jobId:null, orig:null };
function packDraft(job, orig){
  const ref = new Map(); (orig&&orig.scenes||[]).forEach(s=>(s.candidates||[]).forEach(c=>{ if(c&&c.cid) ref.set(c.cid,c); }));
  const strip = c => { if(!c) return c; const o=Object.assign({},c); delete o.local_url; delete o.local_thumb; return o; };
  const clone = JSON.parse(JSON.stringify(job, (k,v)=> (k==="local_url"||k==="local_thumb") ? undefined : v));
  clone.scenes.forEach(sc=>{ sc.candidates=(sc.candidates||[]).map(c=> ref.has(c.cid) ? {cid:c.cid, _ref:1, _rejected:c._rejected||undefined, verified:c.verified||undefined, ai_ok:c.ai_ok} : strip(c)); });
  clone._packed = 1;
  return clone;
}
function unpackDraft(d, orig){
  if(!d || !d._packed) return d;
  const ref = new Map(); (orig&&orig.scenes||[]).forEach(s=>(s.candidates||[]).forEach(c=>{ if(c&&c.cid) ref.set(c.cid,c); }));
  d.scenes.forEach(sc=>{ sc.candidates=(sc.candidates||[]).map(c=> c._ref ? Object.assign({}, ref.get(c.cid)||{cid:c.cid}, {_rejected:c._rejected, verified:c.verified, ai_ok:c.ai_ok}) : c).filter(c=>c&&c.cid); });
  delete d._packed; return d;
}
function jobMeta(){
  const j=S.job||{}, n=(j.scenes||[]).length, r=typeof readyCount==="function"?readyCount():0;
  const first=(j.scenes||[]).map(s=>!s.card&&s.footage).find(c=>c&&/^https?:/.test(c.thumbnail||""));
  return { name:j._name||"", destination:(j.request&&j.request.destination)||"", title:j.title||"", status:"done",
    stage: j.video_at ? "Video made" : (n && r===n ? "Footage approved" : `${r}/${n} approved`),
    thumb: first?first.thumbnail:"", scenes:n, seconds:(j.scenes||[]).reduce((a,s)=>a+(+s.duration_sec||0),0), video_at:j.video_at||"" };
}
function backupLocal(){
  if(!S.job) return;
  try{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("shorts.job.") && k!=="shorts.job."+S.jobId);
    keys.forEach(k=>{ try{ const v=JSON.parse(localStorage.getItem(k)); if(!v||!v.dirty) localStorage.removeItem(k); }catch(e){ localStorage.removeItem(k); } });
  }catch(e){}
  store.set("job."+S.jobId, {saved:Date.now(), version:SAVE.version, dirty:SAVE.dirty, job:packDraft(S.job, SAVE.orig)});
}
function saveLocal(){ // called after every edit
  if(!S.job) return;
  SAVE.dirty=true; SAVE.error=""; backupLocal(); renderSaveState();
  clearTimeout(SAVE.timer); SAVE.timer=setTimeout(()=>saveNow(), 2500);
}
async function saveNow(force){
  clearTimeout(SAVE.timer);
  if(!S.job || !S.jobId) return;
  if(SAVE.saving){ SAVE.again=true; return; }
  if(!SAVE.dirty && !force) return;
  const id=S.jobId; SAVE.saving=true; renderSaveState();
  try{
    const r=await api("save",{job_id:id, base_version:SAVE.version, force:force==="overwrite", draft:packDraft(S.job, SAVE.orig), meta:jobMeta()});
    if(id!==S.jobId) return;
    if(r.conflict){ SAVE.conflict=r; SAVE.error="conflict"; }
    else if(r.ok){ SAVE.version=r.version; SAVE.savedAt=r.saved_at; SAVE.savedBy=S.email; SAVE.dirty=SAVE.again?true:false; SAVE.conflict=null; SAVE.error="";
      backupLocal(); const j=S.jobs.find(x=>String(x.job_id)===id); if(j){ Object.assign(j, jobMeta(), {saved_at:r.saved_at, updated_by:S.email, version:r.version, archived:false}); renderJobs(); } }
    else throw new Error("Save failed");
  }catch(e){ if(id===S.jobId) SAVE.error=e.message||"Couldn't save"; }
  finally{ SAVE.saving=false; renderSaveState(); if(SAVE.again){ SAVE.again=false; SAVE.dirty=true; SAVE.timer=setTimeout(()=>saveNow(),1500); } else if(SAVE.error && SAVE.error!=="conflict" && id===S.jobId){ SAVE.timer=setTimeout(()=>saveNow(),15000); } }
}
function ago(iso){ if(!iso) return ""; const s=(Date.now()-Date.parse(iso))/1000; if(!isFinite(s)) return ""; if(s<60) return "just now"; if(s<3600) return Math.round(s/60)+" min ago"; if(s<86400) return Math.round(s/3600)+" h ago"; const d=new Date(iso); return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function who(email){ return !email ? "" : email===S.email ? "you" : email.split("@")[0]; }
function renderSaveState(){
  const el=$("#saveState"); if(!el) return;
  let cls="", txt="";
  if(SAVE.error==="conflict"){ cls="bad"; txt="Newer version on server"; }
  else if(SAVE.saving){ cls="warn"; txt="Saving…"; }
  else if(SAVE.error){ cls="bad"; txt="Not saved – retrying"; }
  else if(SAVE.dirty){ cls="warn"; txt="Unsaved changes"; }
  else if(SAVE.savedAt){ cls="ok"; txt="✓ Saved "+ago(SAVE.savedAt)+(SAVE.savedBy&&SAVE.savedBy!==S.email?" by "+who(SAVE.savedBy):""); }
  else { cls=""; txt="Not saved yet"; }
  el.className="pill "+cls; el.textContent=txt; el.title = SAVE.error && SAVE.error!=="conflict" ? SAVE.error : "";
  const box=$("#conflictBox"); if(box){
    if(SAVE.conflict){ box.hidden=false; box.innerHTML=`<b>${esc(who(SAVE.conflict.saved_by)||"Someone")}</b> saved a newer version of this video ${esc(ago(SAVE.conflict.saved_at))}. <button class="btn-sm" id="cfLoad">Load their version</button> <button class="btn-sm" id="cfMine">Keep mine (overwrite)</button>`;
      $("#cfLoad").onclick=()=>{ SAVE.conflict=null; SAVE.dirty=false; store.set("job."+S.jobId,null); openJob(S.jobId); };
      $("#cfMine").onclick=()=>{ SAVE.conflict=null; SAVE.error=""; SAVE.dirty=true; saveNow("overwrite"); }; }
    else { box.hidden=true; box.innerHTML=""; }
  }
}
setInterval(()=>{ if(!SAVE.saving && !SAVE.dirty) renderSaveState(); }, 30000);
window.addEventListener("beforeunload", e=>{ if(S.job && (SAVE.dirty||SAVE.saving)){ saveNow(); e.preventDefault(); e.returnValue=""; } });

// load the saved version when a finished job is opened
async function loadSavedJob(id, engineJob){
  SAVE.orig = JSON.parse(JSON.stringify(engineJob)); SAVE.version=0; SAVE.savedAt=""; SAVE.savedBy=""; SAVE.dirty=false; SAVE.error=""; SAVE.conflict=null; SAVE.jobId=id;
  let server=null; try{ const r=await api("draft",{job_id:id}); if(r && r.found && r.draft_json) server=r; }catch(e){ console.warn("draft load", e); }
  const local=store.get("job."+id, null);
  let job=null, fromLocal=false;
  if(server){ try{ job=unpackDraft(JSON.parse(server.draft_json), SAVE.orig); SAVE.version=server.version; SAVE.savedAt=server.saved_at; SAVE.savedBy=server.saved_by; }catch(e){ job=null; } }
  if(local && local.job && (!job || (local.dirty && (local.version||0)>=SAVE.version) || (!server && local.job))){
    job=unpackDraft(local.job, SAVE.orig); fromLocal=true;
    if(!server) SAVE.version=0; else SAVE.version=local.version||SAVE.version;
  }
  if(!job) job=JSON.parse(JSON.stringify(engineJob));
  if(fromLocal){ SAVE.dirty=true; setTimeout(()=>saveNow(), 800); }
  return job;
}

async function toJpegB64(src, max=1024, q=0.9){
  const url = typeof src==="string" ? src : URL.createObjectURL(src);
  const img = await loadImg(url); const s=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));

  return { mime:"image/jpeg", data:c.toDataURL("image/jpeg",q).split(",")[1], url };
